<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open About phone</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f7f7f8}
  .card{background:#fff;border-radius:16px;padding:28px;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  a.btn{display:block;background:#007AFF;color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;margin-top:16px}
  p{color:#555;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h2>Open “About phone”</h2>
  <p>Trying to open your phone’s <b>About phone</b> settings screen…</p>
  <a class="btn" href="intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;end">Tap here if nothing happens</a>
  <p style="font-size:13px;color:#888">Android only. On iPhone, dial <b>*#06#</b> or go to Settings → General → About.</p>
</div>
<script>
  // Android Chrome: navigating to an intent: URL from a page works.
  // Small delay lets the page paint first so there is a fallback if it fails.
  setTimeout(function () {
    window.location.href = "intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;end";
  }, 300);
</script>
</body>
</html>
