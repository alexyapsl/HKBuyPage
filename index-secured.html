<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Galaxy | Samsung HK</title>
</head>
<body>
    <div class="max-w-5xl mx-auto px-6 pt-10 pb-28 sm:pb-24">
        <!-- Step 1: Choose New Device -->
        <div class="mb-20">
            <div class="section-title text-xl mb-5" data-i18n="step1Title" id="step1-title">. . .</div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="device-selection">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Step 2: Storage -->
        <div class="mb-20 sehk-opacity" id="storage-section">
            <div class="section-title text-xl mb-5" data-i18n="step2Title" id="step2-title">. . .</div>
            <!-- Storage Chip Selector (replaces native <select>) -->
            <div class="text-sm font-medium text-gray-700 mb-2" data-i18n="step2SelectStorage" id="storage-label">███</div>
            <div id="storage-chips" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
            <!-- LSV PreOrder Savings line -->
            <div id="lsv-savings-line" class="flex justify-between mt-3 px-5 py-3 bg-blue-50 rounded-xl text-sm font-bold samsung-blue"></div>


            <!-- Inline Color Chip Selector for Step 2b (SKU resolution) -->
            <div id="color-chips-section" class="sehk-hidden mt-7">
                <div id="color-label" data-i18n="step2SelectColor" class="text-sm font-medium text-gray-700 mb-2">. . .</div>
                <div id="color-chips" class="flex flex-wrap gap-2"></div>
                <div id="selected-sku-hint" class="mt-2 text-sm samsung-blue sehk-hidden"></div>
            </div>
        </div>

        <!-- Step 3: Trade-in Device -->
        <div class="mb-20 sehk-opacity" id="tradein-section">

            <div class="flex items-center justify-between mb-5">
                <div class="section-title text-xl" data-i18n="step3Title" id="step3-title">. . .</div>
            </div>

            <!-- No Trade-In Checkbox -->
            <div class="mb-2">
                <div class="flex items-center gap-x-2">
                    <input type="checkbox" id="no-tradein" onchange="toggleNoTradeInNewFlow()" class="ml-2 mt-1 mb-1 w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]">
                    <label for="no-tradein" data-i18n="noTradeInLabel" class="flex-1 py-2 pl-2 text-sm sm:text-base text-gray-700 cursor-pointer hover:text-gray-900" id="no-tradein-label"></label>
                </div>
                <div id="no-tradein-helper" class="sehk-hidden mt-2 py-3 px-5 text-sm bg-blue-50 samsung-blue rounded-xl px-3 py-2" id="no-tradein-helper-text">
                    <div data-i18n="noTradeInHelper"></div>
                    <div data-i18n="stackableTradeIn" class="mt-2"></div>
                </div>
            </div>

            <div class="space-y-4" id="tradein-fields">
                <div>
                    <label class="section-title text-sm text-gray-700 mb-2 block" data-i18n="brandLabel" id="brand-label"></label>
                    <div class="relative">
                        <select id="brand" onchange="updateModelsNewFlow()" class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="section-title text-sm text-gray-700 mb-2 block" data-i18n="modelLabel" id="model-label"></label>
                    <div class="relative">
                        <select id="model" onchange="updateStorageNewFlow()" disabled class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12 disabled:bg-gray-50 disabled:text-gray-400">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="section-title text-sm text-gray-700 mb-2 block" data-i18n="selectStorageTradein" id="tradein-storage-label"></label>
                    <div class="relative">
                        <select id="tradein-storage" onchange="updateTradeInPriceNewFlow()" disabled class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12 disabled:bg-gray-50 disabled:text-gray-400">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>

                <div id="tradein-value-display" class="sehk-opacity mt-2 py-4 px-5 text-sm bg-blue-50 samsung-blue rounded-xl px-3 py-2">
                </div>
            </div>
        </div>

        <!-- Step 4: Bank Promotion -->
        <div class="mb-8 sehk-opacity" id="bank-section">
            <div class="section-title text-xl mb-5" data-i18n="step4Title" id="step4-title">. . .</div>
            <div class="flex items-stretch gap-3 mt-5" id="bank-buttons">
                <!-- Populated by JS -->
            </div>

            <!-- SamsungPay checkbox -->
            <div id="samsungpay-row" class="sehk-opacity mt-3 flex items-center gap-x-2">
                <input type="checkbox" id="samsungpay" onchange="toggleSamsungPay()" class="ml-2 mt-1 mb-1 w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]">
                <label for="samsungpay" data-i18n="samsungPayLabel" class="flex-1 py-3 text-sm sm:text-base text-gray-700 cursor-pointer" id="samsungpay-label">███</label>
            </div>

            <!-- Bank savings display -->
            <div id="bank-savings-display" class="sehk-hidden mt-3 px-5 py-3 bg-blue-50 rounded-xl text-sm samsung-blue">
                <div id="bank-savings-total" class="font-bold mb-3 pb-2 border-b border-blue-200 flex justify-between"></div>
                <div id="bank-savings-lines" class="mt-1 text-sm samsung-blue space-y-0.5"></div>
            </div>
        </div>
    </div>

    <!-- Sticky Bottom Bar -->
    <div id="sticky-bar" class="sehk-hidden fixed bottom-0 left-0 right-0 bg-white z-[60] shadow-lg ">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <div>
                <div id="sticky-device-name" class="font-bold text-[1.1rem] sm:text-[1.15rem] leading-tight truncate"></div>
                <div class="text-sm text-gray-600 mt-0.5 sm:mt-1">
                  <div id="sticky-rrp-line" class="sehk-hidden truncate"></div>
                  <div id="sticky-pay-label" data-i18n="stickyYouPay"></div>
                </div>
            </div>
            <div class="flex items-center justify-between gap-x-2">
                <div class="min-w-0 flex-1">
                    <div>
                        <div id="sticky-final-price" class="text-2xl md:text-3xl font-bold tabular-nums"></div>
                        <div id="sticky-savings" class="samsung-blue text-sm sehk-hidden"></div>
                    </div>
                </div>

                <div class="flex-shrink-0">
                    <div id="buy-now-btn" data-i18n="buyNowBtnText"
                            class="cursor-pointer px-5 py-3 bg-[#007AFF] border-2 border-[#007AFF] text-white hover:text-[#007AFF] text-sm font-bold rounded-full hover:bg-[#FFFFFF] active:bg-blue-50 transition-colors sehk-opacity whitespace-nowrap shadow-sm"
                            onclick="showBuyNowModal()">███</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Color Picker Modal -->
    <div id="color-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[70] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:w-[420px] sm:rounded-xl rounded-t-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-5">
                <div class="font-bold text-base sm:text-xl">${t('colorModalTitle')}</div>
                <button onclick="closeColorModal()" class="text-2xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
            </div>

            <div id="color-options" class="grid grid-cols-1 gap-2 mb-6"></div>

            <div class="flex gap-3">
                <button onclick="closeColorModal()" class="flex-1 py-3.5 rounded-xl border border-gray-300 text-sm font-medium">${t('colorCancel')}</button>
                <button id="confirm-color-btn" onclick="confirmColorSelection()"
                        class="flex-1 py-3.5 rounded-xl samsung-btn text-sm font-medium disabled:opacity-50" disabled>
                    ███
                </button>
            </div>
        </div>
    </div>

    <!-- Gift Selection Modal -->
    <div id="gift-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[120] flex items-end lg:items-center justify-center">
        <div class="bg-white w-full lg:w-[420px] lg:rounded-3xl lg:m-4 rounded-t-2xl p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="font-bold text-xl">███</div>
                <button onclick="closeGiftModal()" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div id="gift-options" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <!-- Samsung Shop App Modal -->
    <div id="samsung-shop-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[110] flex items-end lg:items-center justify-center">
        <div class="bg-white w-full lg:w-[420px] lg:rounded-xl lg:m-4 rounded-t-2xl p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="font-bold text-xl text-gray-900" data-i18n="shopModalTitle">███</div>
                <button onclick="closeSamsungShopModal()" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>

            <div id="samsung-shop-desc" class="text-sm text-gray-700 leading-relaxed mb-5" data-i18n="samsungShopModalDesc">███</div>

            <div class="flex items-center gap-2 mb-6">
                <input type="checkbox" id="add-to-app" checked class="w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]">
                <label for="add-to-app" id="add-to-app-label" class="text-sm text-gray-700" data-i18n="addToAppLabel">███</label>
            </div>

            <div class="flex gap-3">
                <button onclick="downloadSamsungShopApp()" data-i18n="downloadAppBtn" class="flex-1 py-3.5 rounded-xl border border-gray-300 text-sm font-medium">Download App</button>
                <button onclick="proceedFromSamsungShopModal()" data-i18n="addToCartBtn" class="flex-1 py-3.5 rounded-xl samsung-btn text-sm font-medium">███</button>
            </div>
        </div>
    </div>

    <!-- Trade-in Warning Modal -->
    <div id="tradein-warning-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[80] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:w-[420px] sm:rounded-3xl rounded-t-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <div id="tradein-warning-title" data-i18n="tradeinWarningTitle" class="font-bold text-xl text-gray-900">███</div>
                <button onclick="closeTradeInWarningModal()" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>

            <ul class="list-disc ml-4 mb-6">
              <li id="tradein-warning-body-trade-in" data-i18n="tradeinWarningBodyTradeIn" class="text-sm text-gray-700 leading-relaxed mb-2">███</li>
              <li id="tradein-warning-body-spay" data-i18n="tradeinWarningBodySpay" class="sehk-hidden text-sm text-gray-700 leading-relaxed mb-2">███</li>
            </ul>

            <div class="flex gap-3">
                <div onclick="confirmTradeInAndRedirect()" data-i18n="addToCart" class="flex-[2_1_auto] cursor-pointer px-5 py-3 bg-[#007AFF] border-2 border-[#007AFF] text-white hover:text-[#007AFF] text-center text-sm font-bold rounded-full hover:bg-[#FFFFFF] active:bg-blue-49 transition-colors whitespace-nowrap shadow-sm">███</div>
            </div>
        </div>
    </div>

    <!--<script src="https://cdn.tailwindcss.com"></script>-->
    <!--<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: SamsungOne, Arial, system_ui, sans-serif;
            background-color: rgba(0,0,0,0.02); /*#f8f9fa;*/
        }

        input, textarea {
          appearance: auto;
        }

        button {
          border: 1px solid rgba(0,0,0,0);
        }
        
        .heading-font {
            font-family: "Samsung Sharp Sans", SamsungSharpSans, SamsungSharpBold, Arial, system_ui, sans-serif;
            font-weight: bold;
        }

        .samsung-blue {
            color: #007AFF;
        }

        .samsung-btn {
            background-color: #007AFF;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            border-radius: 9999px;
            padding-top: 14px;
            padding-bottom: 14px;
        }
        
        .samsung-btn:hover {
            background-color: #0066CC;
            transform: translateY(-1px);
        }

        .device-card,
        .device-card ~ .absolute {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .device-card:not(.disabled):hover,
        .device-card:not(.disabled):hover ~ .absolute {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .device-card:not(.disabled):active,
        .device-card:not(.disabled):active ~ .absolute {
            transition: none;
            transform: translateY(1px);
            box-shadow: 0 0 0 1px rgb(0 0 0 / 0.3);
        }

        .device-card.selected {
            border-color: #007AFF;
            box-shadow: 0 0 0 1px #007AFF;
        }

        .section-title {
            font-weight: 600;
            letter-spacing: 0;
        }

        #sticky-bar {
            box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.05), 0 -2px 8px -2px rgb(0 0 0 / 0.05);
        }

        .sehk-opacity {
            opacity: 0.2;
            cursor: not-allowed;
            user-select: none;
            pointer-events: none;
        }

        .sehk-hidden {
            display: none !important;
        }

        #selected-sku-hint {
            display: none !important;
        }

        #step1-title,
        #step2-title,
        #step3-title,
        #step4-title {
          display: flex;
          align-items: center;
        }

        #step1-title:before,
        #step2-title:before,
        #step3-title:before,
        #step4-title:before  {
          content: "1";
          display: flex;
          font-size: 14px;
          align-items: center;
          justify-content: center;
          width: 30px;
          height: 30px;
          color: #FFFFFF;
          background-color: rgba(0,0,0,0.6);
          border: 1px solid rgba(0,0,0,0.1);
          border-radius: 50%;
          margin-right: 10px;
        }

        #step2-title:before {
          content: "2";
        }

        #step3-title:before {
          content: "3";
        }

        #step4-title:before {
          content: "4";
        } 
    </style>

        async function fetchWithTimeout(url, options = {}, timeout = 5000) {
          const controller = new AbortController();
          const id = setTimeout(() => controller.abort(), timeout);

          try {
            const parsedUrl = new URL(url);
            parsedUrl.searchParams.set('_', Date.now().toString());
            url = parsedUrl.toString();
          } catch (e) {
            const separator = url.includes('?') ? '&' : '?';
            url = `${url}${separator}_=${Date.now()}`;
          }

          try {
            const response = await fetch(url, {
              ...options,
              signal: controller.signal
            });
            clearTimeout(id);
            return response;
          } catch (error) {
            clearTimeout(id);
            throw error;
          }
        }

        function getLngStr(key) {
            if (i18nData[lang] && i18nData[lang][key]) return i18nData[lang][key];
            if (i18nData['en'] && i18nData['en'][key]) return i18nData['en'][key];
            return key;
        }

        function processLSV(data) {
            lsvMap = {};
            productBySku = {};
            (data.products || []).forEach(p => {
                if (p.sku) productBySku[p.sku] = p;
                if (!p.showInHKBuyPage) return;
                const key = `${p.model}|${p.storage}`;
                if (!lsvMap[key] || p.lsvDiscount > (lsvMap[key].lsvDiscount || 0)) {
                    lsvMap[key] = { rrp: p.rrp, lsvDiscount: p.lsvDiscount || 0 };
                }
            });

            recommendedProducts.forEach(prod => {
                prod.storageOptions.forEach(opt => {
                    const key = `${prod.name}|${opt.storage}`;
                    if (lsvMap[key] && lsvMap[key].rrp) {
                        opt.price = lsvMap[key].rrp;
                    }
                });
            });
            console.log('Processed LSV data for', Object.keys(lsvMap).length, 'storage tiers');
        }

        function updateTradeInPriceNewFlow() {
            const brand = document.getElementById('brand').value;
            const model = document.getElementById('model').value;
            const storage = document.getElementById('tradein-storage').value;
            const valueDisplay = document.getElementById('tradein-value-display');
            const valueAmount = document.getElementById('tradein-value-amount');

            if (!brand || !model || !storage) {
                tradeInValue = 0;
                valueDisplay.classList.add('sehk-opacity');
                document.getElementById('bank-section').classList.add('sehk-opacity');
                updateStickyBar();
                return;
            }

            const device = devices.find(d => 
                d.brand === brand && 
                d.model === model && 
                d.storage === storage
            );

            if (!selectedSku) {
                tradeInValue = 0;
                if (valueDisplay) valueDisplay.classList.add('sehk-opacity');
                return;
            }

            if (device && selectedSku) {
                const sku = selectedSku;
                const gtiVal = device.gti && device.gti[sku] ? device.gti[sku] : 0;
                const etiVal = device.eti && device.eti[sku] ? device.eti[sku] : 0;
                
                let tradeInPrice = 0;
                let isGuaranteed = false;
                
                if (gtiVal > 0) {
                    tradeInPrice = gtiVal;
                    isGuaranteed = true;
                } else {
                    tradeInPrice = device.standardPrice || 0;
                    isGuaranteed = false;
                }
                
                const extraRebate = etiVal;
                tradeInValue = tradeInPrice + extraRebate;

                window.currentTradeInCalc = {
                    tradeInPrice,
                    extraRebate,
                    isGuaranteed,
                    sku
                };
            } else {
                tradeInValue = device ? (device.standardPrice || 0) : 0;
                window.currentTradeInCalc = null;
            }

            if (tradeInValue > 0) {
                if (valueAmount) valueAmount.textContent = `HK$${tradeInValue.toLocaleString()}`;
                if (valueDisplay) valueDisplay.classList.remove('sehk-opacity');
            } else {
                if (valueDisplay) valueDisplay.classList.add('sehk-opacity');
            }

            renderTradeInSavingsBreakdown();

            document.getElementById('bank-section').classList.remove('sehk-opacity');
            document.getElementById('samsungpay-row').classList.remove('sehk-opacity');

            if (window.currentTradeInCalc) {
                trackEvent(
                    'product_option-flagship pdp-option selector-option_click3',
                    `tradein:${device ? device.brand + ' ' + device.model : 'unknown'}`,
                    { tradein_value: tradeInValue, tradein_device: device ? device.model : '', sku: selectedSku }
                );
            } else if (tradeInValue === 0) {
                trackEvent(
                    'product_option-flagship pdp-option selector-option_click3',
                    'tradein:none',
                    { tradein_value: 0 }
                );
            }

            const availableBanks = Object.keys(bankPromotionRules || {});
            if (availableBanks.length > 0 && (!selectedBank || selectedBank === 'none')) {
                /*selectedBank = availableBanks[0];*/
                setTimeout(() => {
                    setupBankButtons();
                    updateBankSavingsDisplay();
                    updateStickyBar();
                }, 80);
            }

            setTimeout(() => {
                document.getElementById('bank-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);

            if (selectedBank && selectedBank !== 'none') {
                setTimeout(() => {
                    document.querySelectorAll('#bank-buttons button').forEach(b => {
                        const key = b.getAttribute('data-bank-key');
                        if (key === selectedBank) {

        let bankPromotionRules = {}; 

        function calculateBankRebate(originalPrice, bankKey, discountInCart = 0) {
            const rule = bankPromotionRules[bankKey];
            if (!rule || originalPrice <= 0) return { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };

            const basePrice = Math.max(0, originalPrice - discountInCart);

            let percent = 0;
            for (const tier of rule.tiers) {
                if (basePrice < tier.max) {          
                    percent = tier.percent;
                    break;
                }
            }

            let percentRebate = Math.floor(basePrice * percent * 100) / 100;
            if (percentRebate > rule.maximum) percentRebate = rule.maximum;

            const fixedRebate = rule.fixedDiscount ? rule.fixedDiscount.value : 0;
            const fixedNameRaw = rule.fixedDiscount?.name || null;
            const fixedName = (fixedNameRaw && typeof fixedNameRaw === 'object')
                ? (fixedNameRaw[lang] || fixedNameRaw.en)
                : fixedNameRaw;
            const totalRebate = percentRebate + fixedRebate;

            return { percentRebate, fixedRebate, fixedName, totalRebate };
        }

        function calculateSamsungPayDiscount(originalPrice) {
            if (originalPrice >= 10000) return 200;
            if (originalPrice >= 6000) return 100;
            if (originalPrice >= 3000) return 50;
            return 0;
        }

                };
                container.appendChild(otherBtn);
                return;
            }

            const bankList = Object.keys(bankPromotionRules)
                .map(key => {
                    const rule = bankPromotionRules[key];
                    const name = (typeof rule.name === 'object') ? (rule.name[lang] || rule.name.en) : rule.name;
                    const rebateName = (typeof rule.rebateName === 'object') ? (rule.rebateName[lang] || rule.rebateName.en) : rule.rebateName;
                    return {
                        key,
                        name,
                        rebateName,
                        logo: rule.logo,
                        priority: rule.priority ?? 999,
                        isRecommended: !!rule.isRecommended
                    };
                })
                .sort((a, b) => a.priority - b.priority);

            bankList.push({ key: 'none', name: t('otherBank'), logo: null, isRecommended: false });

            bankList.forEach(item => {
                const isSelected = selectedBank === item.key;
                const wrapper = document.createElement('div');
                wrapper.className = 'relative flex-1 flex flex-col align-stretch items-stretch';

                const btn = document.createElement('div');
                btn.setAttribute('data-bank-key', item.key);
                btn.className = `device-card cursor-pointer bg-white flex-1 px-1 py-4 rounded-xl border border-gray-300 hover:border-[#007AFF] text-sm flex flex-col items-center text-center gap-1.5 min-w-[72px] transition-all ${isSelected ? '!border-[#007AFF] ring-1 ring-[#007AFF]' : ''}`;

                if (item.logo) {
                    btn.innerHTML = `
                        <img src="${item.logo}" alt="${item.name}" class="h-10 w-auto object-contain pointer-events-none">
                        <span class="text-sm sm:text-sm pointer-events-none">${item.name}</span>
                    `;
                } else {
                    btn.innerHTML = `
                        <div class="h-10 w-12 flex items-center justify-center text-2xl text-gray-400 pointer-events-none">💳</div>
                        <span class="text-sm sm:text-sm pointer-events-none">${item.name}</span>
                    `;
                }

                btn.onclick = () => {
                    trackEvent('product_option-flagship pdp-option selector-option_click3', `bank:${item.name}`, { bank: item.key });
                    selectedBank = item.key;
                    setupBankButtons();
                    updateBankSavingsDisplay();
                    updateStickyBar();

                    setTimeout(() => {
                        const samsungRow = document.getElementById('samsungpay-row');
                        if (samsungRow && !samsungRow.classList.contains('sehk-opacity')) {
                            samsungRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 200);
                };

                wrapper.appendChild(btn);

                if (item.isRecommended) {
                    const badge = document.createElement('div');
                    badge.className = 'absolute -mt-2 -ml-1 top-0 left-0 text-[11px] bg-[#007AFF] text-white px-2 py-0.5 rounded font-medium pointer-events-none';
                    badge.textContent = getLngStr('bankRecommended') || 'Recommended';
                    wrapper.appendChild(badge);
                }

                container.appendChild(wrapper);
            });
        }

        function ensureBankButtons() {
            if (Object.keys(bankPromotionRules || {}).length === 0) {
                setTimeout(() => {
                    if (Object.keys(bankPromotionRules || {}).length > 0) {
                        setupBankButtons();
                    }
                }, 350);
            }
        }

        function updateBankSavingsDisplay() {
            const display = document.getElementById('bank-savings-display');
            const totalEl = document.getElementById('bank-savings-total');
            const linesEl = document.getElementById('bank-savings-lines');

            if (!selectedDevice || selectedStorageIndex === null) {
                display.classList.add('sehk-opacity');
                return;
            }
            const hasBankSelection = selectedBank && selectedBank !== 'none';

            const storageOpt = selectedDevice.storageOptions[selectedStorageIndex];
            const originalPrice = storageOpt.price;

            const lsvKey = `${selectedDevice.name}|${storageOpt.storage}`;
            const lsvInfo = lsvMap[lsvKey] || { rrp: originalPrice, lsvDiscount: 0 };
            const lsvDiscountLocal = lsvInfo.lsvDiscount || 0;

            const samsungPayDiscountLocal = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
            const discountInCartLocal = lsvDiscountLocal + samsungPayDiscountLocal;

            let bankCalc;
            if (hasBankSelection) {
                bankCalc = calculateBankRebate(originalPrice, selectedBank, discountInCartLocal);
            } else {
                bankCalc = { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };
            }

            if (bankCalc.totalRebate <= 0 && !useSamsungPay) {
                display.classList.add('sehk-hidden');
                return;
            }

            const samsungPayDiscount = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
            const grandTotal = bankCalc.totalRebate + samsungPayDiscount;

            const totalLabel = hasBankSelection ? (getLngStr('bankSavingsLabel') || 'Bank promotion savings') : (getLngStr('spaySavingsLabel') || 'SamsungPay savings');
            totalEl.innerHTML = `${totalLabel} <span class="font-bold">HK$${grandTotal.toLocaleString()}</span>`;

            const currentRule = bankPromotionRules[selectedBank];
            const dynamicRebateName = (currentRule && currentRule.rebateName)
              ? (currentRule.rebateName[lang] || currentRule.rebateName.en)
              : t('creditCardRebate');
            linesEl.innerHTML = '';
 
            if (bankCalc.percentRebate > 0) {
                const pctLine = document.createElement('div');
                pctLine.className = "text-sm samsung-blue mt-1 flex justify-between items-end";
                pctLine.innerHTML = `<div>${dynamicRebateName}</div> <div>HK$${bankCalc.percentRebate.toLocaleString()}</div>`;
                linesEl.appendChild(pctLine);
            }
            if (bankCalc.fixedRebate > 0) {
                const fixedNameRaw = bankCalc.fixedName;
                const fixedNameDisplay = (fixedNameRaw && typeof fixedNameRaw === 'object')
                    ? (fixedNameRaw[lang] || fixedNameRaw.en)
                    : (fixedNameRaw || t('specialDiscount'));
                const fixedLine = document.createElement('div');
                fixedLine.className = "text-sm samsung-blue mt-1 flex justify-between items-end";
                fixedLine.innerHTML = `<div>${fixedNameDisplay}</div> <div>HK$${bankCalc.fixedRebate.toLocaleString()}</div>`;
                linesEl.appendChild(fixedLine);
            }
            if (samsungPayDiscount > 0) {
                const samsungLine = document.createElement('div');
                samsungLine.className = "text-sm samsung-blue mt-1 flex justify-between items-end";
                samsungLine.innerHTML = `<div>${t('samsungPayOnlyDiscount')}</div> <div>HK$${samsungPayDiscount.toLocaleString()}</div>`;
                linesEl.appendChild(samsungLine);
            }

            display.classList.remove('sehk-hidden');
        }

        function toggleSamsungPay() {
            useSamsungPay = document.getElementById('samsungpay').checked;

            trackEvent(
                'product_option-flagship pdp-option selector-option_click3',
                useSamsungPay ? 'payment:samsungpay' : 'payment:samsungpay_off',
                { payment_method: useSamsungPay ? 'samsungpay' : 'none' }
            );

            updateBankSavingsDisplay();
            updateStickyBar();

            if (useSamsungPay) {
                setTimeout(() => {
                    const savingsPanel = document.getElementById('bank-savings-display');
                    if (savingsPanel && !savingsPanel.classList.contains('sehk-hidden')) {
                        savingsPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        const bankSection = document.getElementById('bank-section');
                        if (bankSection) {
                            bankSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }, 120);
            }
        }

        function updateStickyBar() {
            const sticky = document.getElementById('sticky-bar');
            const nameEl = document.getElementById('sticky-device-name');
            const payEl = document.getElementById('sticky-pay-label');
            const priceEl = document.getElementById('sticky-final-price');
            const saveEl = document.getElementById('sticky-savings');
            const buyBtn = document.getElementById('buy-now-btn');

            if (!selectedDevice) {
                sticky.classList.add('sehk-hidden');
                return;
            }

            sticky.classList.remove('sehk-hidden');
            const hasStorage = selectedStorageIndex !== null && !isNaN(selectedStorageIndex);

            if (!hasStorage) {
                nameEl.textContent = selectedDevice.name;
                payEl.textContent = getLngStr('fromLabel') || 'From';
                const fromPrice = selectedDevice.storageOptions[0].price;
                priceEl.innerHTML = `HK$${formatPrice(fromPrice)}`;
                saveEl.classList.add('sehk-hidden');
                buyBtn.style.display = 'none';
                return;
            }

            const opt = selectedDevice.storageOptions[selectedStorageIndex];
            const originalPrice = opt.price;

            const key = `${selectedDevice.name}|${opt.storage}`;
            const lsvInfo = lsvMap[key] || { rrp: originalPrice, lsvDiscount: 0 };
            const lsvDiscount = lsvInfo.lsvDiscount || 0;

            const samsungPayDiscount = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
            const discountInCartForBank = lsvDiscount + samsungPayDiscount;
            const bankCalc = (selectedBank && selectedBank !== 'none')
                ? calculateBankRebate(originalPrice, selectedBank, discountInCartForBank)
                : { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };
            const bankRebate = bankCalc.totalRebate || 0;

            const finalPrice = Math.max(0, originalPrice - lsvDiscount - tradeInValue - bankRebate - samsungPayDiscount);
            const totalSavings = originalPrice - finalPrice;

            nameEl.textContent = `${selectedDevice.name} · ${opt.storage}`;

            const rrpLine = document.getElementById('sticky-rrp-line');
            if (rrpLine) {
                if (totalSavings > 0) {
                    rrpLine.textContent = `${getLngStr('originalLabel') || 'Original'}: HK$${formatPrice(originalPrice)}`;
                    rrpLine.classList.remove('sehk-hidden');
                } else {
                    rrpLine.classList.add('sehk-hidden');
                }
            }

            const hasTradeIn = tradeInValue > 0;
            const hasBankPromo = (selectedBank && selectedBank !== 'none' && bankRebate > 0) || useSamsungPay;
            const hasLSV = lsvDiscount > 0;

            let payLabel = getLngStr('payLabelDefault') || 'You pay';
            if (hasLSV && hasTradeIn && hasBankPromo) payLabel = getLngStr('payLabelAll');
            else if (hasLSV && hasTradeIn) payLabel = getLngStr('payLabelStorageTI');
            else if (hasLSV && hasBankPromo) payLabel = getLngStr('payLabelStorageBank');
            else if (hasLSV) payLabel = getLngStr('payLabelStorage');
            else if (hasTradeIn && hasBankPromo) payLabel = getLngStr('payLabelTIBank');
            else if (hasTradeIn) payLabel = getLngStr('payLabelTI');
            else if (hasBankPromo) payLabel = getLngStr('payLabelBank');

            payEl.innerHTML = `▼ ${payLabel}`;
            priceEl.innerHTML = `HK$${formatPrice(finalPrice)}`;

            const totalCartDiscount = lsvDiscount + samsungPayDiscount;   
            const totalRebate = bankRebate + tradeInValue;               

            if (totalSavings > 0) {
                saveEl.innerHTML = '';

                if (totalCartDiscount > 0) {
                    const d1 = document.createElement('div');
                    d1.textContent = `${getLngStr('discountInCart') || 'Discount in cart:'}: HK$${formatPrice(totalCartDiscount)}`;
                    saveEl.appendChild(d1);
                }

                if (totalRebate > 0) {
                    const r1 = document.createElement('div');
                    r1.textContent = `${getLngStr('rebateLabelUpTo') || 'Rebate:'}: HK$${formatPrice(totalRebate)}`;
                    saveEl.appendChild(r1);
                }

                saveEl.classList.remove('sehk-hidden');
            } else {
                saveEl.classList.add('sehk-hidden');
            }

            buyBtn.style.display = 'inline-block';
            adjustContentPadding();
        }

        function formatPrice(n) {
            if (!n) return '0.00';
            if (Number.isInteger(n)) return n.toLocaleString();
            return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function adjustContentPadding() {
            const sticky = document.getElementById('sticky-bar');
            const main = document.querySelector('.max-w-5xl.mx-auto');
            if (!sticky || !main) return;

            if (sticky.classList.contains('sehk-hidden') || sticky.offsetHeight === 0 || !selectedDevice) {
                main.style.paddingBottom = '28px';
                return;
            }

            const h = sticky.offsetHeight + 24; 
            main.style.paddingBottom = `${h}px`;
        }

        async function loadDevices() {
            try {
                const res = await fetchWithTimeout(`${baseJsonPath}devices.json`, { timeout: 500 });
                if (res.ok) {
                    devices = await res.json();
                } else {
                    throw new Error();
                }
                console.log('Loaded', devices.length, 'devices');
            } catch (e) {
                console.error('Failed to load devices.json, using fallback datasets context structure', e);
                devices = fallback_devices;
            }
        }

        function startTitleLoadingAnimation() {
            const titleEl = document.getElementById('step1-title');
            if (!titleEl) return;
            
            let dotCount = 0;
            titleEl.textContent = ". ";
            
            if (titleLoadingInterval) clearInterval(titleLoadingInterval);
            
            titleLoadingInterval = setInterval(() => {
                dotCount = (dotCount % 5) + 1;
                titleEl.textContent = ". ".repeat(dotCount);
            }, 150); // Cycles every 400ms
        }

        function stopTitleLoadingAnimation() {
            if (titleLoadingInterval) {
                clearInterval(titleLoadingInterval);
                titleLoadingInterval = null;
            }
            const titleEl = document.getElementById('step1-title');
            if (titleEl) titleEl.textContent = t('step1Title');
        }

        window.onload = async function() {
            startTitleLoadingAnimation();

            await loadTranslations();
            lang = getCurrentLang();
            console.log("lang = " + lang);
            await loadDevices();
            await loadLSVData();
            init();
            
            stopTitleLoadingAnimation();
            initLng();
            setupBankButtons();
            refreshTradeInPlaceholders();
            
            window.addEventListener('resize', () => {
                if (typeof adjustContentPadding === 'function') adjustContentPadding();
            });
        };
        const origSelectNewDevice = window.selectNewDevice;
        window.selectNewDevice = function(...args) {
            document.getElementById('bank-savings-display')?.classList.add('sehk-hidden');
            return origSelectNewDevice?.apply(this, args);
        };

        let currentModalProductIdx = null;
        let currentModalCard = null;
        let selectedGiftSku = null;
        let pendingMagicUrl = null;

        function showBuyNowModal() {
            if (!selectedDevice || selectedStorageIndex === null) return;

            const storageOpt = selectedDevice.storageOptions[selectedStorageIndex];

            currentModalProductIdx = null;
            currentModalCard = null;
            if (!selectedSku && storageOpt.colors && storageOpt.colors.length > 0) {
                selectedSku = storageOpt.colors[0].sku;
            }
            selectedGiftSku = null;

            showGiftModal();
        }

        function closeColorModal(keepState = false) {
            const modal = document.getElementById('color-modal');
            modal.classList.remove('flex');
            modal.classList.add('sehk-opacity');
            if (!keepState) {
                selectedSku = null;
                currentModalProductIdx = null;
                currentModalCard = null;
            }
        }

        function confirmColorSelection() {
            if (!selectedSku) return;
            closeColorModal(true);
            
            const guard = document.getElementById('sku-guard');
            const tradeinSection = document.getElementById('tradein-section');
            if (guard) guard.style.display = 'none';
            if (tradeinSection) {
                tradeinSection.classList.remove('sehk-opacity');
                const hint = document.createElement('div');
                hint.className = 'text-sm samsung-blue mb-2';
                hint.textContent = getLngStr('skuResolved') + ' ' + selectedSku;
                const existingHint = tradeinSection.querySelector('.sku-hint');
                if (existingHint) existingHint.remove();
                hint.classList.add('sku-hint');
                tradeinSection.insertBefore(hint, tradeinSection.firstChild.nextSibling);
            }
            
            showGiftModal();
        }

        function showGiftModal() {
            let giftModal = document.getElementById('gift-modal');
            if (!giftModal) {
                giftModal = document.createElement('div');
                giftModal.id = 'gift-modal';
                giftModal.className = 'sehk-opacity fixed inset-0 bg-black/50 z-[120] flex items-end lg:items-center justify-center';
                giftModal.innerHTML = `
                    <div class="bg-white w-full lg:w-[420px] lg:rounded-xl lg:m-4 rounded-t-2xl p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="font-bold text-xl">${t('chooseGiftModalTitle')}</div>
                            <button onclick="closeGiftModal()" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
                        </div>
                        <div id="gift-options" class="space-y-3"></div>
                    </div>
                `;
                document.body.appendChild(giftModal);
            } else {
                const titleEl = giftModal.querySelector('.font-bold.text-xl');
                if (titleEl) titleEl.textContent = t('chooseGiftModalTitle');
            }

            const storageOpt = selectedDevice.storageOptions[selectedStorageIndex];
            const color = storageOpt.colors.find(c => c.sku === selectedSku);
            if (!color) { alert('Color not found'); return; }

            const optionsContainer = giftModal.querySelector('#gift-options');
            optionsContainer.innerHTML = '';

            const seen = new Set();
            console.log("selectedDevice.name = "+selectedDevice.name);

            const uniqueApplicableGifts = (gifts || []).filter(g => {
                if (g['Parent Model'] !== selectedDevice.name || g.Active !== 'Y') return false;
                if (seen.has(g.GiftCode)) return false;
                seen.add(g.GiftCode);
                return true;
            });

            if (uniqueApplicableGifts.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-sm text-gray-500 p-4 border border-gray-200 rounded-xl';
                empty.textContent = t('giftNoAvailable');
                optionsContainer.appendChild(empty);
            }

            uniqueApplicableGifts.forEach((gift) => {
                const giftCode = gift.GiftCode;
                const name = (lang === 'zh')
                    ? (gift.GiftNameZH || gift.GiftNameEN || giftCode)
                    : (gift.GiftNameEN || gift.GiftNameZH || giftCode);
                const image = gift['SKU Image'] || '';
                const priceStr = gift.Price || 'Free';
                const mode = gift.Mode;
                const skuOrCode = gift['SKU_PromoCode'];

                const priceLabel = (priceStr && priceStr !== 'Free')
                    ? `<div class="text-sm text-[#007AFF] mt-0.5 font-medium">${t('giftAddPrice').replace('{price}', priceStr)}</div>`
                    : `<div class="text-sm samsung-blue mt-0.5">${t('giftFree')}</div>`;

                const btn = document.createElement('div');
                btn.className = 'device-card cursor-pointer w-full flex items-center gap-4 p-4 border border-gray-300 rounded-xl text-left';
                btn.innerHTML = `
                    <img src="${image}" class="w-16 h-16 object-contain" alt="${name}">
                    <div>
                        <div class="font-medium text-gray-900">${name}</div>
                        ${priceLabel}
                    </div>
                `;
                btn.onclick = () => {
                    closeGiftModal();

                    const canonical = productBySku[selectedSku] || {};
                    const lang = getCurrentLang(); 
                    const oosLink = (lang === 'zh') ? canonical.oosLink : canonical.oosLinkEn;
                    const oosParam = oosLink ? `&oosLink=${encodeURIComponent(oosLink)}` : '';
                    const samsungPayCode = useSamsungPay ? '&voucherCode=SPAY2026' : '';

                    const magicDomain = !window.location.href.includes('samsung.com') 
                        ? 'https://www.samsung.com/' 
                        : '';

                    const magicBase = (lang === 'zh')
                        ? '/hk/offer/magic/'
                        : '/hk_en/offer/magic/';

                    let magicUrl;
                    if (mode === 'AddSKU') {
                        magicUrl = `${magicDomain}${magicBase}?productCode[1]=${selectedSku}&productQty[1]=1&productCode[2]=${skuOrCode}&productQty[2]=1&store=B2C&newCart=true${oosParam}${samsungPayCode}`;
                    } else {
                        magicUrl = `${magicDomain}${magicBase}?productCode[1]=${selectedSku}&productQty[1]=1&store=B2C&newCart=true${oosParam}${samsungPayCode}`;
                    }

                    console.log("magicUrl = " + magicUrl);

                    pendingMagicUrl = magicUrl;
                    appendShopAppUrl();

                    const hasTradeIn = tradeInValue > 0;
                    const hasSamsungPay = useSamsungPay === true;

                    if (hasTradeIn) {
                      document.getElementById('tradein-warning-body-trade-in').classList.remove('sehk-hidden');
                    } else {
                      document.getElementById('tradein-warning-body-trade-in').classList.add('sehk-hidden');
                    }
                    
                    if (hasTradeIn) {
                        showTradeInWarningModal();
                    } else {
                        confirmTradeInAndRedirect();
                    }
                };
                optionsContainer.appendChild(btn);
            });

            giftModal.classList.remove('sehk-hidden');
            giftModal.classList.add('flex');
        }

        function closeGiftModal() {
            const giftModal = document.getElementById('gift-modal');
            if (giftModal) {
                giftModal.classList.remove('flex');
                giftModal.classList.add('sehk-hidden');
            }
        }

        function showTradeInWarningModal() {
            document.getElementById('tradein-warning-modal').classList.remove('sehk-hidden');
        }

        function closeTradeInWarningModal() {
            document.getElementById('tradein-warning-modal').classList.add('sehk-hidden');
        }

        function confirmTradeInAndRedirect() {
            closeTradeInWarningModal();
            if (pendingMagicUrl) {
                window.open(pendingMagicUrl, '_self');
            }
            pendingMagicUrl = null;
        }

        function appendShopAppUrl() {
            if (isInApp) {
                if (pendingMagicUrl && !pendingMagicUrl.includes('app=true')) {
                    const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                    pendingMagicUrl += `${separator}app=true`;
                }
                return;
            }
        }

        function showSamsungShopModal() {
            if (isInApp) {
                if (pendingMagicUrl && !pendingMagicUrl.includes('app=true')) {
                    const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                    pendingMagicUrl += `${separator}app=true`;
                }
                showTradeInWarningModal();
                return;
            }

            const modal = document.getElementById('samsung-shop-modal');
            if (modal) {
                modal.classList.remove('sehk-opacity');
                modal.classList.add('flex');
            } else {
                showTradeInWarningModal();
            }
        }

        function closeSamsungShopModal() {
            const modal = document.getElementById('samsung-shop-modal');
            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('sehk-opacity');
            }
        }

        function downloadSamsungShopApp() {
            window.open('https://samsungshop.onelink.me/6zKq/z089lfy4', '_blank');
        }

        function proceedFromSamsungShopModal() {
            const modal = document.getElementById('samsung-shop-modal');
            const checkbox = document.getElementById('add-to-app');

            if (checkbox && checkbox.checked && pendingMagicUrl) {
                if (!pendingMagicUrl.includes('app=true')) {
                    const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                    pendingMagicUrl += `${separator}app=true`;
                }
            }

            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('sehk-opacity');
            }
            showTradeInWarningModal();
        }

        const origUpdateStickyBar = window.updateStickyBar;
        window.updateStickyBar = function() {
            origUpdateStickyBar?.();
            const btn = document.getElementById('buy-now-btn');
            const sticky = document.getElementById('sticky-bar');
            const hasStorage = (typeof selectedStorageIndex !== 'undefined' && selectedStorageIndex !== null && !isNaN(selectedStorageIndex));
            if (btn) btn.style.display = (sticky.classList.contains('sehk-opacity') || !hasStorage) ? 'none' : '';
        };

        window.dataLayer = window.dataLayer || [];

        function trackEvent(action, label, extra = {}) {
            const payload = {
                event: 'pd_buying_tool_interaction',
                an_tr: action,
                an_ca: 'option click',
                an_ac: 'pd buying tool',
                an_la: label,
                ...extra
            };
            window.dataLayer.push(payload);
            console.log('[Analytics]', payload);
        }
    </script>
