<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Galaxy | Samsung HK</title>
</head>
<body>
<div id="buy-module">
    <div data-impression="loaded" class="max-w-5xl mx-auto px-6 pt-10 pb-10">
        <!-- Step 1: Choose New Device -->
        <div class="mb-10 md:mb-20">
            <div class="section-title text-xl md:text-3xl mb-5" data-i18n="step1Title" id="step1-title">. . .</div>
            <div class="section-title text-sm md:text-xl text-gray-700 mb-2" data-i18n="step1SelectDevice" id="storage-label"></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="device-selection">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Step 2: Storage -->
        <div class="mb-10 md:mb-20 sehk-opacity" id="storage-section">
            <div class="section-title text-xl md:text-3xl mb-5" data-i18n="step2Title" id="step2-title">. . .</div>
            <!-- Storage Chip Selector (replaces native <select>) -->
            <div class="section-title text-sm md:text-xl text-gray-700 mb-2" data-i18n="step2SelectStorage" id="storage-label">███</div>
            <div id="storage-chips" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
            <!-- LSV PreOrder Savings line -->
            <div id="lsv-savings-line" class="flex justify-between mt-3 px-5 py-3 bg-blue-50 rounded-xl text-sm md:text-xl font-bold samsung-blue font-bold"></div>


            <!-- Inline Color Chip Selector for Step 2b (SKU resolution) -->
            <div id="color-chips-section" class="sehk-hidden mt-7">
                <div id="color-label" data-i18n="step2SelectColor" class="section-title text-sm md:text-xl text-gray-700 mb-2">. . .</div>
                <div id="color-chips" class="flex flex-wrap gap-3"></div>
                <div id="selected-sku-hint" class="mt-2 text-sm samsung-blue font-bold sehk-hidden"></div>
                <div id="selected-sku-image" class="flex justify-between mt-3 px-5 py-3 bg-white rounded-xl text-sm font-bold samsung-blue font-bold">
                    <img class="h-[33vh] w-full sm:h-60 lg:h-60 object-contain">
                </div>
            </div>
        </div>

        <!-- Step 3: Trade-in Device -->
        <div class="mb-10 md:mb-20 sehk-opacity" id="tradein-section">

            <div class="flex items-center justify-between mb-5">
                <div class="section-title text-xl md:text-3xl" id="step3-title">
                    <div>
                        <div data-i18n="step3Title">. . .</div>
                        <div class="text-sm text-gray-700 mb-2 md:text-xl" data-i18n="step3SubTitle"></div>
                    </div>
                </div>
            </div>
            <div class="section-title text-sm md:text-xl text-gray-700 mb-2" data-i18n="step3SelectTradeInDevice"></div>

            <!-- No Trade-In Checkbox -->
            <div class="mb-2">
                <div class="flex items-center gap-x-2">
                    <input type="checkbox" id="no-tradein" onchange="toggleNoTradeInNewFlow()" class="ml-2 mt-1 mb-1 w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]" data-tracking="trade-in quote : no-trade-in">
                    <label for="no-tradein" data-i18n="noTradeInLabel" class="flex-1 py-2 pl-2 text-sm sm:text-base md:text-xl text-gray-700 cursor-pointer hover:text-gray-900" id="no-tradein-label"></label>
                </div>
                <div id="no-tradein-helper" class="sehk-hidden mt-2 py-3 px-5 text-sm md:text-base bg-blue-50 samsung-blue font-bold rounded-xl px-3 py-2">
                    <div data-i18n="noTradeInHelper" class="mb-3 pb-2 border-b border-blue-200 md:text-xl"></div>
                    <div data-i18n="stackableTradeIn"></div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4" id="tradein-fields">
              <div class="md:flex-1 min-w-0 flex flex-col gap-4">
                <div>
                    <label class="section-title text-sm md:text-xl text-gray-700 mb-2 block" data-i18n="brandLabel" id="brand-label"></label>
                    <div class="relative">
                        <select id="brand" onchange="updateModelsNewFlow()" class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12 md:text-xl">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="section-title text-sm md:text-xl text-gray-700 mb-2 block" data-i18n="modelLabel" id="model-label"></label>
                    <div class="relative">
                        <select id="model" onchange="updateStorageNewFlow()" disabled class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12 md:text-xl disabled:bg-gray-50 disabled:text-gray-400">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="section-title text-sm md:text-xl text-gray-700 mb-2 block" data-i18n="selectStorageTradein" id="tradein-storage-label"></label>
                    <div class="relative">
                        <select id="tradein-storage" onchange="updateTradeInPriceNewFlow()" disabled class="w-full border border-gray-300 hover:border-[#007AFF] focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 appearance-none bg-white pr-12 md:text-xl disabled:bg-gray-50 disabled:text-gray-400">
                            <option value=""></option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>
              </div>

              <div id="tradein-value-display" class="md:flex-1 sehk-hidden">
                <div id="tradein-value-text" class="mt-3 px-5 py-3 bg-blue-50 rounded-xl text-sm md:text-base samsung-blue font-bold">
                </div>

                <div class="text-xs md:text-base text-gray-600 mt-4 px-2">
                  <span data-i18n="tradeInDisclaimer"></span><br>
                  <span data-i18n="gtiDisclaimer"></span>
                </div>
              </div>
            </div>
        </div>

        <!-- IMEI Modal (ShanHS live trade-in quote) -->
        <div id="imei-modal" class="sehk-hidden fixed inset-0 z-50 flex items-center justify-center" style="background: rgba(0,0,0,0.5);">
            <div class="bg-white rounded-2xl p-6 w-11/12 max-w-md shadow-xl">
                <div class="text-lg md:text-xl font-bold mb-2">Enter your trade-in device IMEI</div>
                <div class="text-sm md:text-base text-gray-600 mb-4">Dial *#06# on the device you want to trade in to find its 15-digit IMEI.</div>
                <input id="imei-input" type="text" maxlength="15" autocomplete="off" placeholder="15-digit IMEI" class="w-full border border-gray-300 focus:border-[#007AFF] focus:outline-none rounded-xl px-5 py-4 text-lg tracking-widest">
                <div id="imei-error" class="sehk-hidden text-red-500 text-sm mt-2"></div>
                <div class="flex gap-3 mt-5">
                    <button type="button" onclick="closeImeiModal()" class="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-gray-700">Cancel</button>
                    <button type="button" onclick="submitImei()" class="flex-1 bg-[#007AFF] text-white rounded-xl px-4 py-3 font-bold">Get quote</button>
                </div>
            </div>
        </div>

        <!-- Step 4: Bank Promotion -->
        <div class="mb-8 sehk-opacity" id="bank-section">
            <div class="section-title text-xl md:text-3xl mb-5" id="step4-title">
                <div data-i18n="step4Title">. . .</div>
            </div>
            <div class="section-title text-sm md:text-xl text-gray-700 mb-2" data-i18n="step4SelectPayment" id="storage-label"></div>

            <div class="flex items-stretch flex-wrap gap-3 mt-5" id="bank-buttons">
                <!-- Populated by JS -->
            </div>

            <!-- SamsungPay checkbox -->
            <div id="samsungpay-row" class="sehk-opacity mt-3 flex items-center gap-x-2 sehk-hidden-always" data-tracking="bank pro : samsungpay-row">
                <input type="checkbox" id="samsungpay" onchange="toggleSamsungPay()" class="ml-2 mt-1 mb-1 w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]">
                <label for="samsungpay" data-i18n="samsungPayLabel" class="flex-1 py-3 text-sm sm:text-base md:text-xl text-gray-700 cursor-pointer" id="samsungpay-label">███</label>
            </div>

            <!-- Bank savings display -->
            <div id="bank-savings-display" class="sehk-hidden">
              <div class="mt-3 px-5 py-3 bg-blue-50 rounded-xl text-sm md:text-base samsung-blue font-bold">
                  <div id="bank-savings-total" class="font-bold mb-3 pb-2 border-b border-blue-200 flex justify-between md:text-xl"></div>
                  <div id="bank-savings-lines" class="mt-1 font-bold space-y-0.5"></div>
              </div>
              
              <div class="text-xs md:text-base text-gray-600 mt-4 px-2" data-i18n="paymentDislaimer"></div>
            </div>
        </div>
    </div>

    <!-- Sticky Bottom Bar -->
    <div id="sticky-bar" class="sehk-hidden fixed bottom-0 left-0 right-0 bg-white z-[60] shadow-lg ">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <div>
                <div id="sticky-device-name" class="font-bold text-[1.1rem] sm:text-[1.15rem] md:text-xl leading-tight truncate"></div>
                <div class="text-sm md:text-base text-gray-600 mt-0.5 sm:mt-1">
                  <div id="sticky-rrp-line" class="sehk-hidden truncate"></div>
                  <div id="sticky-pay-label" data-i18n="stickyYouPay"></div>
                </div>
            </div>
            <div class="flex items-center justify-between gap-x-2">
                <div class="min-w-0 flex-1">
                    <div>
                        <div id="sticky-final-price" class="text-2xl md:text-3xl font-bold tabular-nums"></div>
                        <div id="sticky-savings" class="samsung-blue font-bold text-sm md:text-base sehk-hidden"></div>
                    </div>
                </div>

                <div class="flex-shrink-0">
                    <div id="buy-now-btn" data-i18n="buyNowBtnText"
                            class="cursor-pointer px-5 py-3 md:px-7 bg-[#007AFF] border-2 border-[#007AFF] text-white hover:text-[#007AFF] text-sm md:text-base font-bold rounded-full hover:bg-[#FFFFFF] active:bg-blue-50 transition-colors sehk-opacity whitespace-nowrap shadow-sm"
                            onclick="showBuyNowModal()">███</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gift Selection Modal -->
    <div id="gift-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[120] flex items-end lg:items-center justify-center">
        <div class="bg-white w-full lg:w-[560px] lg:rounded-3xl lg:m-4 rounded-t-2xl p-6">
            <div class="flex items-center justify-between mb-1">
                <div id="giftModelTite" class="font-bold text-xl md:text-3xl">███</div>
                <button onclick="closeGiftModal()" class="text-2xl text-gray-400 hover:text-gray-600 cursor-pointer px-2">&times;</button>
            </div>
            <div id="giftModelSubTite" class="font-bold text-sm md:text-base mb-4">███</div>
            <div id="gift-options" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <!-- Samsung Shop App Modal -->
    <div id="samsung-shop-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[110] flex items-end lg:items-center justify-center">
        <div class="bg-white w-full lg:w-[560px] lg:rounded-xl lg:m-4 rounded-t-2xl p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="font-bold text-xl md:text-3xl text-gray-900" data-i18n="shopModalTitle">███</div>
                <button onclick="closeSamsungShopModal()" class="text-2xl text-gray-400 hover:text-gray-600 px-2">&times;</button>
            </div>

            <div id="samsung-shop-desc" class="text-sm text-gray-700 leading-relaxed mb-5" data-i18n="samsungShopModalDesc">███</div>

            <div class="flex items-center gap-2 mb-6">
                <input type="checkbox" id="add-to-app" checked class="w-4 h-4 text-[#007AFF] border-gray-300 rounded focus:ring-[#007AFF]">
                <label for="add-to-app" id="add-to-app-label" class="text-sm text-gray-700" data-i18n="addToAppLabel">███</label>
            </div>

            <div class="flex gap-3">
                <button onclick="downloadSamsungShopApp()" data-i18n="downloadAppBtn" class="flex-1 py-3.5 rounded-xl border border-gray-300 text-sm font-medium">Download App</button>
                <button onclick="proceedFromSamsungShopModal()" data-i18n="addToCartBtn" class="flex-1 py-3.5 rounded-xl samsung-btn text-sm font-medium">███</button>
            </div>
        </div>
    </div>

    <!-- Trade-in Warning Modal -->
    <div id="tradein-warning-modal" class="sehk-hidden fixed inset-0 bg-black/50 z-[80] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:w-[420px] lg:w-[560px] sm:rounded-3xl  rounded-t-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <div id="tradein-warning-title" data-i18n="tradeinWarningTitle" class="font-bold text-xl md:text-2xl text-gray-900">███</div>
                <button onclick="closeTradeInWarningModal()" class="text-2xl text-gray-400 hover:text-gray-600 cursor-pointer px-2">&times;</button>
            </div>

            <ul class="list-disc ml-4 mb-6 text-sm md:text-xl text-gray-700 leading-relaxed ">
              <li id="tradein-warning-body-trade-in" data-i18n="tradeinWarningBodyTradeIn" class="mb-2">███</li>
              <li id="tradein-warning-body-spay" data-i18n="tradeinWarningBodySpay" class="sehk-hidden mb-2">███</li>
            </ul>

            <div class="flex gap-3">
                <div id="finalAddToCartBtn" onclick="confirmTradeInAndRedirect()" data-i18n="addToCart" class="flex-[2_1_auto] cursor-pointer px-5 py-3 bg-[#007AFF] border-2 border-[#007AFF] text-white hover:text-[#007AFF] text-center text-sm md:text-base font-bold rounded-full hover:bg-[#FFFFFF] active:bg-blue-49 transition-colors whitespace-nowrap shadow-sm">███</div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

    input, textarea {
      appearance: auto;
    }

    button {
      border: 1px solid rgba(0,0,0,0);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto !important;
      }
    }
    
    .heading-font {
        font-family: "Samsung Sharp Sans", SamsungSharpSans, SamsungSharpBold, Arial, system_ui, sans-serif;
        font-weight: bold;
    }

    .samsung-blue {
        color: #1280ff;
    }

    .samsung-btn {
        background-color: #1280ff;
        color: white;
        font-weight: 600;
        transition: all 0.2s ease;
        border-radius: 9999px;
        padding-top: 14px;
        padding-bottom: 14px;
    }
    
    .samsung-btn:hover {
        background-color: #0066CC;
        transform: translateY(-1px);
    }

    .device-card,
    .device-card ~ .absolute {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .device-card:not(.disabled):hover,
    .device-card:not(.disabled):hover ~ .absolute {
        transform: translateY(-1px);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    
    .device-card:not(.disabled):active,
    .device-card:not(.disabled):active ~ .absolute {
        transition: none;
        transform: translateY(1px);
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.3);
    }

    .device-card.selected {
        border-color: #007AFF;
        box-shadow: 0 0 0 1px #007AFF;
    }

    .section-title {
        font-weight: 600;
        letter-spacing: 0;
    }

    #sticky-bar {
        box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.05), 0 -2px 8px -2px rgb(0 0 0 / 0.05);
    }

    .sehk-opacity {
        opacity: 0.2;
        cursor: not-allowed;
        user-select: none;
        pointer-events: none;
    }

    .sehk-hidden {
        display: none !important;
    }

    .sehk-hidden-always {
        display: none !important;
    }

    #selected-sku-hint {
        display: none !important;
    }

    #sticky-device-name,
    #step1-title,
    #step2-title,
    #step3-title,
    #step4-title,
    #giftModelTite,
    #tradein-warning-title,
    .product-name {
      font-family: SamsungSharpSans,SamsungOne,Microsoft JhengHei,微软雅黑,Simsun,宋体,arial,sans-serif !important;
    }

    #step1-title,
    #step2-title,
    #step3-title,
    #step4-title {
      display: flex;
      align-items: flex-start;
    }

    #step1-title:before,
    #step2-title:before,
    #step3-title:before,
    #step4-title:before  {
      content: "1";
      display: flex;
      font-size: 14px;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      color: #FFFFFF;
      background-color: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      margin-right: 10px;
    }

    #step1-title:before,
    #step2-title:before,
    #step3-title:before,
    #step4-title:before {
      @media (width >= 48rem) {
        font-size: 16px;
      }
    }

    #step2-title:before {
      content: "2";
    }

    #step3-title:before {
      content: "3";
    }

    #step4-title:before {
      content: "4";
    } 

    @media screen and (max-width: 767px) {
      #step1-title,
      #step2-title,
      #step3-title,
      #step4-title {
        flex-direction: column;
        gap: 12px;
      }
    }

    #buy-module a[target="_blank"] {
      color: #1280ff;
    }
</style>

<style>

      monospace;

      --color-gray-400: oklch(70.7% 0.022 261.325);
      --color-gray-500: oklch(55.1% 0.027 264.364);

    hr {

    async function fetchWithTimeout(url, options = {}, timeout = 5000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);

      try {
        const parsedUrl = new URL(url);
        parsedUrl.searchParams.set('_', Date.now().toString());
        url = parsedUrl.toString();
      } catch (e) {
        const separator = url.includes('?') ? '&' : '?';
        url = `${url}${separator}_=${Date.now()}`;
      }

      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    function processLSV(data) {
        lsvMap = {};
        productBySku = {};
        (data.products || []).forEach(p => {
            if (p.sku) productBySku[p.sku] = p;
            if (!p.showInHKBuyPage) return;
            const key = `${p.model}|${p.storage}`;
            if (!lsvMap[key] || p.lsvDiscount > (lsvMap[key].lsvDiscount || 0)) {
                lsvMap[key] = { rrp: p.rrp, lsvDiscount: p.lsvDiscount || 0 };
            }
        });

        recommendedProducts.forEach(prod => {
            prod.storageOptions.forEach(opt => {
                const key = `${prod.name}|${opt.storage}`;
                if (lsvMap[key] && lsvMap[key].rrp) {
                    opt.price = lsvMap[key].rrp;
                }
            });
        });
        console.log('Processed LSV data for', Object.keys(lsvMap).length, 'storage tiers');
    }

    // === LIVE STOCK CHECK (getSimpleProductsInfo API, falls back to JSON InStockStatus) ===
    const liveStockStatus = {}; // sku -> true (in stock) / false (oos); absent = unknown → JSON fallback
    const liveProductInfo = {}; // sku -> { shippingETA, backOrderMessage } (locale follows API path)

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isSkuInStock(sku) {
        if (Object.prototype.hasOwnProperty.call(liveStockStatus, sku)) {
            return liveStockStatus[sku] === true;
        }
        const canonical = productBySku[sku] || {};
        return !(canonical.InStockStatus === 'N' || canonical.inStock === false);
    }

    async function fetchStockLevels(skus) {
        const uniqueSkus = [...new Set((skus || []).filter(Boolean))];
        if (uniqueSkus.length === 0) return false;
        // NB: the cache layer in front of this API keys on the FIRST productCodes value
        // only — a unique throwaway code first guarantees a fresh + complete response.
        const cacheBuster = 'CB' + Date.now();
        const qs = [cacheBuster, ...uniqueSkus].map(s => 'productCodes=' + encodeURIComponent(s)).join('&');
        try {
            // Locale-aware path: zh → /hk/, en → /hk_en/ (localized shippingETA/backOrderMessage)
            const stockApiLang = (getCurrentLang() === 'zh') ? 'hk' : 'hk_en';
            const res = await fetch(`https://shop.samsung.com/${stockApiLang}/servicesv2/getSimpleProductsInfo?${qs}`, { cache: 'no-store' });
            if (!res.ok) throw new Error('stock check HTTP ' + res.status);
            const data = await res.json();
            const requested = new Set(uniqueSkus);
            (data.productDatas || []).forEach(p => {
                if (p && p.productCode && requested.has(p.productCode)) {
                    liveStockStatus[p.productCode] = (p.stockLevelStatus === 'inStock');
                    liveProductInfo[p.productCode] = {
                        shippingETA: p.shippingETA || null,
                        backOrderMessage: p.backOrderMessage || null
                    };
                }
            });
            return true;
        } catch (e) {
            console.warn('Live stock check failed, falling back to JSON InStockStatus', e);
            return false;
        }
    }

    function getDeviceSkus(device) {
        const skus = [];
        ((device && device.storageOptions) || []).forEach(opt => (opt.colors || []).forEach(c => skus.push(c.sku)));
        return skus;
    }

    function getAllSkus() {
        const skus = [];
        (recommendedProducts || []).forEach(p => skus.push(...getDeviceSkus(p)));
        return skus;
    }

    function showColorChipsForSelectedStorage(storageOpt, isRefresh = false) {
        const section = document.getElementById('color-chips-section');
        const container = document.getElementById('color-chips');
        const hint = document.getElementById('selected-sku-hint');
        const prevSku = isRefresh ? selectedSku : null;

        if (!section || !container || !storageOpt || !storageOpt.colors || storageOpt.colors.length === 0) {
            if (section) section.style.display = 'none';
            return;
        }

        if (Object.keys(productBySku).length === 0) {
            console.warn('productBySku empty, deferring color chips');
            setTimeout(() => showColorChipsForSelectedStorage(storageOpt, isRefresh), 150);
            return;
        }

        section.classList.remove('sehk-hidden');
        container.innerHTML = '';
        if (hint) hint.classList.add('sehk-hidden');

        selectedSku = null;

        if (!isRefresh) {
            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 120);
        }

        storageOpt.colors.forEach((color, i) => {
            const canonical = productBySku[color.sku] || { hexCode: null };
            const isOos = !isSkuInStock(color.sku);
            const isEstoreOnly = !!(canonical.estoreExclusive || canonical.EstoreExclusive || canonical['Estore Exclusive']);

            const chip = document.createElement('div');

            let colorNameDisplay = color.name;
            if (typeof color.name === 'object') {
                colorNameDisplay = color.name[lang] || color.name.en;
            } else if (canonical.colorZh || canonical.colorEn) {
                colorNameDisplay = (lang === 'zh')
                    ? (canonical.colorZh || canonical.colorEn)
                    : (canonical.colorEn || canonical.colorZh);
            }

            chip.setAttribute("data-tracking",`color : ${color.name} : ${color.sku}`);
            chip.setAttribute("data-sku", color.sku);
            chip.className = `device-card flex flex-wrap items-end justify-between px-4 py-3 md:py-4 border border-gray-300 rounded-xl text-sm text-nowrap transition-all ${isOos ? 'text-gray-400 bg-gray-100/80 cursor-not-allowed disabled' : 'cursor-pointer hover:border-[#007AFF] bg-white'} ${isEstoreOnly ? 'min-w-[100%] sm:min-w-[unset] -order-1' : 'min-w-[45%] sm:min-w-[unset]'}`;

            chip.innerHTML = `
                <div class="flex items-center gap-x-2">
                  <div class="w-5 h-5 rounded-full flex-shrink-0 text-base border border-gray-300 sm:text-[1.1rem]" style="background: ${canonical.hexCode || '#9ca3af'};"></div>
                  <span class="font-medium mt-1 text-base sm:text-[1.1rem] md:text-xl">${colorNameDisplay}</span>
                </div>
            `;

            const storeLabel = isEstoreOnly ? `<div class="text-sm text-right samsung-blue font-bold md:text-base">${t('samsungComOnly')}</div>` : '';
            const oosLabel = isOos ? `<div class="text-sm text-right text-gray-500">${t('outOfStock')}</div>` : '';

            if (isEstoreOnly || isOos) {
              chip.innerHTML += `<div class="ml-5">${storeLabel}${oosLabel}</div>`;
            }

            // Live shipping ETA / backorder message from getSimpleProductsInfo (localized via API path)
            const liveInfo = liveProductInfo[color.sku];
            if (liveInfo) {
                const etaLines = [];
                if (liveInfo.shippingETA) etaLines.push(escapeHtml(liveInfo.shippingETA));
                if (liveInfo.backOrderMessage) etaLines.push(escapeHtml(liveInfo.backOrderMessage));
                if (etaLines.length > 0) {
                    chip.innerHTML += `<div class="basis-full w-full mt-1 text-xs text-gray-500 leading-snug whitespace-normal">${etaLines.join('<br>')}</div>`;
                }
            }

            if (!isOos) {
                chip.onclick = () => {
                    container.querySelectorAll('div').forEach(c => c.classList.remove('!border-[#007AFF]', 'ring-1', 'ring-1'));
                    chip.classList.add('!border-[#007AFF]', 'ring-1', 'ring-[#007AFF]');
                    selectedSku = color.sku;
                    if (hint) { hint.textContent = t('skuResolved') + ' ' + selectedSku; hint.classList.remove('sehk-opacity'); }

                    const skuImageContainer = document.getElementById('selected-sku-image');
                    if (skuImageContainer) {
                        let img = skuImageContainer.querySelector('img');
                        if (!img) {
                            img = document.createElement('img');
                            skuImageContainer.appendChild(img);
                        }
                        
                        const imgUrl = color.image || canonical.image || color.imageUrl;
                        
                        if (imgUrl) {
                            img.src = imgUrl;
                            skuImageContainer.classList.remove('sehk-hidden');
                        } else {
                            skuImageContainer.classList.add('sehk-hidden');
                        }
                    }

                    trackEvent(
                        'product_option-flagship pdp-option selector-option_click3',
                        `color:${colorNameDisplay}`,
                        { sku: color.sku, color: colorNameDisplay, model: selectedDevice ? selectedDevice.name : '' }
                    );

                    const tradeInSec = document.getElementById('tradein-section');
                    if (tradeInSec) {
                        tradeInSec.classList.remove('sehk-opacity');
                        /*
                        setTimeout(() => {
                            tradeInSec.scrollIntoView({ behavior: 'smooth', block: 'end' });
                        }, 120);
                        */
                    }

                    setTimeout(() => {
                        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 120);

                    const bankSec = document.getElementById('bank-section');
                    if (bankSec) bankSec.classList.add('sehk-opacity');

                    window.currentTradeInCalc = null;
                    tradeInValue = 0;

                    const buyBtn = document.getElementById('buy-now-btn');
                    if (buyBtn) buyBtn.classList.remove('sehk-opacity');

                    const noTradeInChk = document.getElementById('no-tradein');
                    const wasNoTradeIn = noTradeInChk && noTradeInChk.checked;

                    const brand = document.getElementById('brand')?.value;
                    const model = document.getElementById('model')?.value;
                    const storage = document.getElementById('tradein-storage')?.value;
                    if (brand && model && storage && !wasNoTradeIn) {
                        setTimeout(() => {
                            updateTradeInPriceNewFlow();
                        }, 50);
                    }

                    if (wasNoTradeIn && noTradeInChk) {
                        noTradeInChk.checked = true;
                        setTimeout(() => {
                            const fields = document.getElementById('tradein-fields');
                            const valueDisplay = document.getElementById('tradein-value-display');
                            const samsungRow = document.getElementById('samsungpay-row');

                            if (fields) fields.style.display = 'none';
                            if (valueDisplay) valueDisplay.classList.add('sehk-hidden');
                            tradeInValue = 0;

                            const bankSecEl = document.getElementById('bank-section');
                            if (bankSecEl) bankSecEl.classList.remove('sehk-opacity');
                            if (samsungRow) samsungRow.classList.remove('sehk-opacity');

                            if (bankPromotionRules && bankPromotionRules.boc) {
                                selectedBank = Object.keys(bankPromotionRules)[0];
                                setupBankButtons();
                                updateBankSavingsDisplay();
                                updateStickyBar();
                            }

                            setTimeout(() => {
                                if (bankSecEl) bankSecEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 150);
                        }, 60);
                    }

                    updateStickyBar();
                };
            }
            container.appendChild(chip);
        });

        // On stock-refresh re-render: restore previous color selection if still in stock, otherwise drop it
        if (isRefresh && prevSku) {
            if (isSkuInStock(prevSku)) {
                selectedSku = prevSku;
                const prevChip = container.querySelector(`[data-sku="${prevSku}"]`);
                if (prevChip) prevChip.classList.add('!border-[#007AFF]', 'ring-1', 'ring-[#007AFF]');
            } else {
                const skuImageContainer = document.getElementById('selected-sku-image');
                if (skuImageContainer) {
                    skuImageContainer.classList.add('sehk-hidden');
                    const img = skuImageContainer.querySelector('img');
                    if (img) img.src = '';
                }
                document.getElementById('buy-now-btn')?.classList.add('sehk-opacity');
                document.getElementById('tradein-section')?.classList.add('sehk-opacity');
                document.getElementById('bank-section')?.classList.add('sehk-opacity');

    async function shanhsPost(path, bizObj) {
        const res = await fetch(SHANHS_PROXY_BASE + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bizObj)
        });
        if (!res.ok) throw new Error('ShanHS proxy HTTP ' + res.status);
        return res.json();
    }

    function imeiError(msg) {
        const e = document.getElementById('imei-error');
        if (e) { e.textContent = msg; e.classList.remove('sehk-hidden'); }

    function hideImeiError() {

    async function submitImei() {
        const imei = (document.getElementById('imei-input').value || '').trim();
        if (!/^[A-Za-z0-9]{15}$/.test(imei)) {
            imeiError('Please enter a valid 15-digit IMEI (dial *#06# on the device).');
            return;
        }
        if (!pendingQuote) { closeImeiModal(); return; }
        const { device, key } = pendingQuote;
        // Official Samsung IMEI check first (JSONP — works on any origin).
        // Samsung's own localized error message is shown in the modal on failure.
        try {
            const check = await tiValidateImei(device, imei);
            if (!check.ok) { imeiError(check.message); return; }
        } catch (e) {
            console.warn('Samsung validateImei call failed, continuing with ShanHS verify only', e);
        }
        pendingQuote = null;
        closeImeiModal();
        fetchShanhsQuote(device, imei, key);
    }

    async function fetchShanhsQuote(device, imei, key) {
        const valueDisplay = document.getElementById('tradein-value-display');
        const container = document.getElementById('tradein-value-text');
        if (valueDisplay) valueDisplay.classList.remove('sehk-hidden');
        if (container) {
            container.classList.remove('sehk-opacity');
            container.innerHTML = '<div class="font-bold md:text-xl">Getting trade-in quote…</div>';
        }
        try {
            // 1) verify the IMEI is recyclable
            const verify = await shanhsPost('/sapi/gateway/shanhs-global-recycle-api/samsung/verify/imei', {
                modelId: String(device.modelId), imei, isNewDevice: 'false'
            });
            if (verify.code !== 0) throw new Error(verify.message || 'IMEI verification failed');
            // status 'Y' = IMEI recyclable; hasRecycle true = already locked to an existing recycle order
            if (verify.data && verify.data.status && verify.data.status !== 'Y') {
                throw new Error('This device is not eligible for trade-in.');
            }
            if (verify.data && verify.data.hasRecycle === true) {
                throw new Error('This device already has a trade-in order.');
            }

            // 2) price-cal, assuming best condition (first answer of each assessment group)
            const detailIds = [device.storageDetailId, device.channelDetailId, ...(device.bestIds || [])].filter(Boolean);
            const quote = await shanhsPost('/sapi/gateway/shanhs-global-recycle-api/samsung/price-cal', {
                memberLevel: 3,
                modelId: String(device.modelId),
                detailIds,
                recyclePhoneImei: imei,
                newPhoneModelCode: selectedSku,
                newSkuList: []
            });
            if (quote.code !== 0) throw new Error(quote.message || 'Price calculation failed');

            lastImei = imei;
            lastQuoteKey = key;
            tradeInValue = (quote.data.price || 0) + (quote.data.ticketPrice || 0);
            window.currentTradeInCalc = {
                tradeInPrice: quote.data.price || 0,
                extraRebate: quote.data.ticketPrice || 0,
                isGuaranteed: false,
                sku: selectedSku,
                calUUId: quote.data.calUUId,
                imei,
                modelId: device.modelId,
                detailIds,
                device
            };
            showTradeInOutcome(device);
        } catch (err) {
            tradeInValue = 0;
            window.currentTradeInCalc = null;
            lastQuoteKey = null;
            if (container) {
                container.classList.remove('sehk-opacity');
                container.innerHTML = '<div class="font-bold text-red-600 md:text-xl">Trade-in quote failed</div>' +
                    '<div class="mt-1 text-sm md:text-base text-red-500">' + escapeHtml(err.message || String(err)) + '</div>';
            }
            document.getElementById('bank-section').classList.add('sehk-opacity');
            updateStickyBar();
        }
    }

    function updateTradeInPriceNewFlow() {
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const storage = document.getElementById('tradein-storage').value;
        const valueDisplay = document.getElementById('tradein-value-display');

        if (!brand || !model || !storage) {
            tradeInValue = 0;
            window.currentTradeInCalc = null;
            lastQuoteKey = null;
            valueDisplay.classList.add('sehk-hidden');
            document.getElementById('bank-section').classList.add('sehk-opacity');
            updateStickyBar();
            return;
        }

        const device = devices.find(d =>
            d.brand === brand &&
            d.model === model &&
            d.storage === storage
        );

        if (!device || !selectedSku) {
            tradeInValue = 0;
            window.currentTradeInCalc = null;
            if (valueDisplay) valueDisplay.classList.add('sehk-hidden');
            return;
        }

        const key = [brand, model, storage, selectedSku].join('|');
        if (key === lastQuoteKey && window.currentTradeInCalc) {
            showTradeInOutcome(device); // same selection already quoted — just re-show
            return;
        }

        if (device.shanhs) {
            // ShanHS live quote: reuse IMEI if already entered this session, else ask
            if (lastImei) {
                fetchShanhsQuote(device, lastImei, key);
            } else {
                pendingQuote = { device, key };
                openImeiModal();
            }
            return;
        }

        // Legacy static dataset (devices.json fallback)
        const sku = selectedSku;
        const gtiVal = device.gti && device.gti[sku] ? device.gti[sku] : 0;
        const etiVal = device.eti && device.eti[sku] ? device.eti[sku] : 0;

        let tradeInPrice = 0;
        let isGuaranteed = false;

        if (gtiVal > 0) {
            tradeInPrice = gtiVal;
            isGuaranteed = true;
        } else {
            tradeInPrice = device.standardPrice || 0;
            isGuaranteed = false;
        }

        tradeInValue = tradeInPrice + etiVal;
        window.currentTradeInCalc = { tradeInPrice, extraRebate: etiVal, isGuaranteed, sku };
        lastQuoteKey = key;
        showTradeInOutcome(device);
    }

    let bankPromotionRules = {}; 

    function calculateBankRebate(originalPrice, bankKey, discountInCart = 0) {
        const rule = bankPromotionRules[bankKey];
        if (!rule || originalPrice <= 0) return { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };

        const basePrice = Math.max(0, originalPrice - discountInCart);

        let percent = 0;
        for (const tier of rule.tiers) {
            if (basePrice < tier.max) {          
                percent = tier.percent;
                break;
            }
        }

        let percentRebate = Math.floor(basePrice * percent * 100) / 100;
        if (percentRebate > rule.maximum) percentRebate = rule.maximum;

        const fixedRebate = rule.fixedDiscount ? rule.fixedDiscount.value : 0;
        const fixedNameRaw = rule.fixedDiscount?.name || null;
        const fixedName = (fixedNameRaw && typeof fixedNameRaw === 'object')
            ? (fixedNameRaw[lang] || fixedNameRaw.en)
            : fixedNameRaw;
        const totalRebate = percentRebate + fixedRebate;

        return { percentRebate, fixedRebate, fixedName, totalRebate };
    }

    function calculateSamsungPayDiscount(originalPrice) {
        if (originalPrice >= 10000) return 200;
        if (originalPrice >= 6000) return 100;
        if (originalPrice >= 3000) return 50;
        return 0;
    }

    function updateBankSavingsDisplay() {
        const display = document.getElementById('bank-savings-display');
        const totalEl = document.getElementById('bank-savings-total');
        const linesEl = document.getElementById('bank-savings-lines');

        if (!selectedDevice || selectedStorageIndex === null) {
            display.classList.add('sehk-opacity');
            return;
        }
        const hasBankSelection = selectedBank && selectedBank !== 'none';

        const storageOpt = selectedDevice.storageOptions[selectedStorageIndex];
        const originalPrice = storageOpt.price;

        const lsvKey = `${selectedDevice.name}|${storageOpt.storage}`;
        const lsvInfo = lsvMap[lsvKey] || { rrp: originalPrice, lsvDiscount: 0 };
        const lsvDiscountLocal = lsvInfo.lsvDiscount || 0;

        const samsungPayDiscountLocal = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
        const discountInCartLocal = lsvDiscountLocal + samsungPayDiscountLocal;

        let bankCalc;
        if (hasBankSelection) {
            bankCalc = calculateBankRebate(originalPrice, selectedBank, discountInCartLocal);
        } else {
            bankCalc = { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };
        }

        if (bankCalc.totalRebate <= 0 && !useSamsungPay) {
            display.classList.add('sehk-hidden');
            return;
        }

        const samsungPayDiscount = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
        const grandTotal = bankCalc.totalRebate + samsungPayDiscount;

        const totalLabel = hasBankSelection ? (getLngStr('bankSavingsLabel') || 'Bank promotion savings') : (getLngStr('spaySavingsLabel') || 'SamsungPay savings');
        totalEl.innerHTML = `${totalLabel} <span class="font-bold">HK$${grandTotal.toLocaleString()}</span>`;

        const currentRule = bankPromotionRules[selectedBank];
        const dynamicRebateName = (currentRule && currentRule.rebateName)
          ? (currentRule.rebateName[lang] || currentRule.rebateName.en)
          : t('creditCardRebate');
        linesEl.innerHTML = '';

        if (bankCalc.percentRebate > 0) {
            const pctLine = document.createElement('div');
            pctLine.className = "mt-1 flex justify-between items-start";
            pctLine.innerHTML = `<div>${dynamicRebateName}</div> <div>HK$${bankCalc.percentRebate.toLocaleString()}</div>`;
            linesEl.appendChild(pctLine);
        }
        if (bankCalc.fixedRebate > 0) {
            const fixedNameRaw = bankCalc.fixedName;
            const fixedNameDisplay = (fixedNameRaw && typeof fixedNameRaw === 'object')
                ? (fixedNameRaw[lang] || fixedNameRaw.en)
                : (fixedNameRaw || t('specialDiscount'));
            const fixedLine = document.createElement('div');
            fixedLine.className = "mt-1 flex justify-between items-start";
            fixedLine.innerHTML = `<div>${fixedNameDisplay}</div> <div>HK$${bankCalc.fixedRebate.toLocaleString()}</div>`;
            linesEl.appendChild(fixedLine);
        }
        if (samsungPayDiscount > 0) {
            const samsungLine = document.createElement('div');
            samsungLine.className = "mt-1 flex justify-between items-start";
            samsungLine.innerHTML = `<div>${t('samsungPayOnlyDiscount')}</div> <div>HK$${samsungPayDiscount.toLocaleString()}</div>`;
            linesEl.appendChild(samsungLine);
        }

        display.classList.remove('sehk-hidden');
    }

    function updateStickyBar() {
        const sticky = document.getElementById('sticky-bar');
        const nameEl = document.getElementById('sticky-device-name');
        const payEl = document.getElementById('sticky-pay-label');
        const priceEl = document.getElementById('sticky-final-price');
        const saveEl = document.getElementById('sticky-savings');
        const buyBtn = document.getElementById('buy-now-btn');

        if (!selectedDevice) {
            sticky.classList.add('sehk-hidden');
            return;
        }

        sticky.classList.remove('sehk-hidden');
        const hasStorage = selectedStorageIndex !== null && !isNaN(selectedStorageIndex);

        if (!hasStorage) {
            nameEl.textContent = selectedDevice.name;
            payEl.textContent = getLngStr('fromLabel') || 'From';
            const fromPrice = selectedDevice.storageOptions[0].price;
            priceEl.innerHTML = `HK$${formatPrice(fromPrice)}`;
            saveEl.classList.add('sehk-hidden');
            buyBtn.style.display = 'none';
            return;
        }

        const opt = selectedDevice.storageOptions[selectedStorageIndex];
        const originalPrice = opt.price;

        const key = `${selectedDevice.name}|${opt.storage}`;
        const lsvInfo = lsvMap[key] || { rrp: originalPrice, lsvDiscount: 0 };
        const lsvDiscount = lsvInfo.lsvDiscount || 0;

        const samsungPayDiscount = useSamsungPay ? calculateSamsungPayDiscount(originalPrice) : 0;
        const discountInCartForBank = lsvDiscount + samsungPayDiscount;
        const bankCalc = (selectedBank && selectedBank !== 'none')
            ? calculateBankRebate(originalPrice, selectedBank, discountInCartForBank)
            : { percentRebate: 0, fixedRebate: 0, totalRebate: 0 };

    function flattenShanhsDevices(list) {
        const rows = [];
        (list || []).forEach(d => {
            const brandDisp = SHANHS_BRAND_DISPLAY[d.brand] || d.brand;
            // strip redundant brand prefix from model name ("Samsung Galaxy S25 Ultra" -> "Galaxy S25 Ultra")
            let modelDisp = d.model || '';
            const esc = String(d.brand).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            modelDisp = modelDisp.replace(new RegExp('^' + esc + '\\s+', 'i'), '');
            (d.storages || []).forEach(s => {
                rows.push({
                    brand: brandDisp,
                    model: modelDisp,
                    storage: s.name,
                    shanhs: true,
                    modelId: d.modelId,
                    brandId: d.brandId,
                    categoryId: d.categoryId,

                    storageDetailId: s.detailId,
                    channelDetailId: d.channelDetailId,
                    bestIds: d.bestIds || [],
                    gtiFlag: d.gtiFlag
                });
            });
        });
        return rows;

    // === OFFICIAL SAMSUNG TRADE-IN CHAIN (validated end-to-end 2026-08-16) ===
    // Flow: validateImei (JSONP) -> getTradeInSimpleInfo -> csrf -> questionnaire (OCC)
    //       -> filterDevices walk (OCC) -> assessment submit (storefront, CSRF token)
    //       -> additionalInfos ride on the main product in the normal addToCart POST.
    // The full chain only works on *.samsung.com origins (CORS). validateImei works anywhere via JSONP.
    function tiLangs() {
        const currentLang = getCurrentLang();
        const l = (currentLang === 'zh') ? 'hk' : 'hk_en';
        return { apiLang: l, shopLang: l };
    }

    function tiJsonp(url) {
        return new Promise((resolve, reject) => {
            const cb = 'tiJsonpCb' + Date.now() + Math.floor(Math.random() * 1000);
            const script = document.createElement('script');
            const timer = setTimeout(() => { cleanup(); reject(new Error('IMEI validation timed out')); }, 12000);
            const cleanup = () => { clearTimeout(timer); try { delete window[cb]; } catch (_) { window[cb] = undefined; } script.remove(); };
            window[cb] = (data) => { cleanup(); resolve(data); };
            script.onerror = () => { cleanup(); reject(new Error('IMEI validation request failed')); };
            script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
            document.head.appendChild(script);
        });
    }

    // Official IMEI check. Returns { ok:true } or { ok:false, message } (Samsung's localized message).
    async function tiValidateImei(device, imei) {
        const { shopLang } = tiLangs();
        const url = `https://shop.samsung.com/${shopLang}/servicesv2/validateImeiWithoutProduct?provider=SHS&brandId=${device.brandId}&code=${encodeURIComponent(imei)}&supportType=1&modelId=${device.modelId}`;
        const data = await tiJsonp(url);
        if (data && data.resultCode === '0000') return { ok: true };
        return { ok: false, message: (data && data.resultMessage) || 'IMEI validation failed' };
    }

    const tiAiVal = (node, k) => {
        const f = ((node && node.additionalInfos) || []).find(i => i.key === k);
        return f ? String(f.value) : '';
    };

    async function tiGetTradeInSimpleInfo(shopLang, targetSku) {
        // Initializes server-side trade-in state for the product being bought.
        const res = await fetch(`https://shop.samsung.com/${shopLang}/servicesv2/getTradeInSimpleInfo?productCode=${encodeURIComponent(targetSku)}`, {
            credentials: 'include', headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error('Trade-in init failed (' + res.status + ')');
        return res.json();
    }

    async function tiFetchCsrf(shopLang) {
        const res = await fetch(`https://shop.samsung.com/${shopLang}/security/csrf`, {
            credentials: 'include', headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error('CSRF token request failed (' + res.status + ')');
        const data = await res.json();
        if (!data || !data.token) throw new Error('CSRF token missing');
        return data.token;
    }

    async function tiFetchQuestions(apiLang, modelId) {
        const res = await fetch(`https://api.shop.samsung.com/tokocommercewebservices/v2/${apiLang}/servicesv2/assessment/TRADE_IN?q=${encodeURIComponent(modelId)}&provider=SHS`, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ imei: '' })
        });
        if (!res.ok) throw new Error('Trade-in questionnaire request failed (' + res.status + ')');
        const data = await res.json();
        return data.questions || [];
    }

    // NB: the OCC variant is used on purpose — the storefront /servicesv2/filterDevices
    // 500s on the SAMSUNG model list (bad catalog data). OCC + mainProductCode works.
    async function tiFilterDevices(apiLang, key, targetSku) {
        const res = await fetch(`https://api.shop.samsung.com/tokocommercewebservices/v2/${apiLang}/tradeIn/services/filterDevices?key=${encodeURIComponent(key)}&provider=SHS&mainProductCode=${encodeURIComponent(targetSku)}`, {
            credentials: 'include', headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error('Trade-in catalog request failed (' + res.status + ')');
        return res.json();
    }

    async function tiBuildSelectionResponses(apiLang, device, targetSku) {
        const categoryId = String(device.categoryId || '1');
        if (categoryId === '3') throw new Error('Online trade-in is not supported for laptops yet — please add it in the cart instead.');
        const levels = [];
        const dtList = await tiFilterDevices(apiLang, '', targetSku);
        const dtNode = dtList.find(n => tiAiVal(n, 'deviceType') === categoryId) || dtList[0];
        if (!dtNode) throw new Error('Trade-in catalog unavailable');
        levels.push(dtNode);

        const brandList = await tiFilterDevices(apiLang, dtNode.key, targetSku);
        const brandNode = brandList.find(n => tiAiVal(n, 'brand') === String(device.brandId));
        if (!brandNode) throw new Error('Trade-in brand not found in Samsung catalog');
        levels.push(brandNode);

        const modelList = await tiFilterDevices(apiLang, brandNode.key, targetSku);
        const modelNode = modelList.find(n => tiAiVal(n, 'model') === String(device.modelId));
        if (!modelNode) throw new Error('Trade-in model not found in Samsung catalog');
        levels.push(modelNode);

        if (categoryId === '1') {
            // phones/tablets have a capacity level between model and purchaseChannel
            const capList = await tiFilterDevices(apiLang, modelNode.key, targetSku);
            const capNode = capList.find(n => tiAiVal(n, 'capacity') === String(device.storageDetailId));
            if (!capNode) throw new Error('Trade-in capacity not found in Samsung catalog');
            levels.push(capNode);
        }

        const chanList = await tiFilterDevices(apiLang, levels[levels.length - 1].key, targetSku);
        const chanNode = chanList.find(n => tiAiVal(n, 'purchaseChannel') === String(device.channelDetailId || '1920')) || chanList[0];
        if (!chanNode) throw new Error('Trade-in channel not found in Samsung catalog');
        levels.push(chanNode);

        const baseProduct = targetSku.split('-').slice(0, 2).join('-'); // SM-S9480ZSPTGY -> SM-S9480
        levels.forEach(n => { n.mainBaseProductCode = baseProduct; });
        for (let i = 1; i < levels.length; i++) {
            levels[i].parent = { key: null, name: levels[i - 1].name, value: levels[i - 1].value, code: null, parent: null, mainProductCode: null, additionalInfos: null, imeiCheckInfo: null, imeiCheckOptions: null, priceMap: null, additionalDiscountApplied: false, isChildPresent: false, identifier: null, identifierName: null, provider: null, hideFlag: false, mainBaseProductCode: null, baseProductPriorityMap: null, campaignBonuses: null, offeredPriceMap: null };
        }
        levels[levels.length - 1].maxTradeIn = '';
        return levels;
    }

    // Runs the whole assessment for the current trade-in selection (perfect condition assumed:
    // first answer of every question) and returns the services array for addToCart.
    // Throws Error with a user-displayable message on failure.
    async function tiSubmitAssessment(device, imei, targetSku) {
        const { apiLang, shopLang } = tiLangs();

        // Re-validate the IMEI right before submitting (catches recycled/locked devices)
        const check = await tiValidateImei(device, imei);
        if (!check.ok) throw new Error(check.message);

        await tiGetTradeInSimpleInfo(shopLang, targetSku);

        const [csrfToken, questions, selectionResponses] = await Promise.all([
            tiFetchCsrf(shopLang),
            tiFetchQuestions(apiLang, device.modelId),
            tiBuildSelectionResponses(apiLang, device, targetSku)
        ]);

        const responses = questions
            .filter(q => q.answers && q.answers.length > 0)
            .map(q => ({ name: q.questionId, value: q.answers[0].value }));
        responses.push({ name: 'voucherCode' });
        responses.push({ name: 'purchaseFrom', value: '0' });

        const body = {
            imei,
            orderEntryNumber: 0,
            productCode: '1',
            responses,
            targetProductCode: targetSku,
            selectionResponses
        };
        const res = await fetch(`https://shop.samsung.com/${shopLang}/assessment/TRADE_IN/json?CSRFToken=${encodeURIComponent(csrfToken)}&provider=SHS`, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Trade-in assessment failed (' + res.status + ')');
        const data = await res.json();
        const infos = (data.result && data.result.additionalInfos) || [];
        const get = k => { const f = infos.find(i => i.key === k); return f ? f.value : undefined; };
        const errMsg = get('ERROR');
        if (errMsg) throw new Error(errMsg); // Samsung's localized eligibility message
        if (get('resultCode') !== '100' || !get('tradeInIdentifier')) throw new Error(t('addToCartError'));

        // addToCart payload = IMEI first, assessment infos verbatim (key/value only), usedPrice last
        const serviceInfos = [{ key: 'IMEI', value: imei }];
        infos.forEach(i => serviceInfos.push({ key: i.key, value: i.value }));
        const gti = parseFloat(get('gtiPrice') || '0');
        serviceInfos.push({ key: 'usedPrice', value: gti > 0 ? 'gtiPrice,tickPrice' : 'tickPrice' });
        return [{ serviceCode: 'T-SHS-TRADEIN', additionalInfos: serviceInfos }];
    }
    // === END OFFICIAL TRADE-IN CHAIN ===

    // === NEW POST-BASED ADD TO CART (replaces magic link) ===
    function showErrorModal(message) {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999';
        modal.innerHTML = `
            <div style="background:white;border-radius:16px;padding:32px 24px;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2)">
                <div style="font-size:48px;margin-bottom:12px;color:#e74c3c">⚠️</div>
                <div style="font-size:18px;font-weight:600;margin-bottom:20px;color:#333">${message}</div>
                <button onclick="this.closest('.error-modal').remove()" style="background:#007AFF;color:white;border:none;padding:12px 32px;border-radius:9999;font-size:15px">OK</button>
            </div>`;
        modal.className = 'error-modal';
        document.body.appendChild(modal);
    }

    async function addToCartPost(products, voucherId = null, showError = true) {
        const currentLang = getCurrentLang();
        const apiLang = (currentLang === 'zh') ? 'hk' : 'hk_en';
        const ADD_URL = `https://api.shop.samsung.com/tokocommercewebservices/v2/${apiLang}/addToCart/multi/?fields=BASIC`;
        const VOUCHER_URL = `https://p1-sms-api-cdn.shop.samsung.com/tokocommercewebservices/v2/${apiLang}/users/current/carts/current/vouchers?lang=${currentLang === 'zh' ? 'zh_HK' : 'en_HK'}&curr=HKD`;

        try {
            const res = await fetch(ADD_URL, {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json, text/javascript, */*; q=0.01'
                },
                body: JSON.stringify(products)
            });

            if (!res.ok) {
                // Samsung sometimes returns XML (`<List><item>...`) for cart errors — never assume JSON.
                const errBody = await res.text().catch(() => '');
                console.error('Add-to-cart failed', res.status, res.headers.get('content-type'), errBody.slice(0, 4000));
                if (res.status === 400) {
                    if (showError) showErrorModal(t('addToCartError'));
                    return false;
                }
                throw new Error('Cart POST failed: ' + res.status);
            }

            if (voucherId) {
                await fetch(VOUCHER_URL, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voucherId, voucherPopup: false })
                });
            }

            return true;
        } catch (e) {
            if (showError) showErrorModal(t('addToCartError'));
            return false;
        }
    }
    // === END NEW POST LOGIC ===

    async function confirmTradeInAndRedirect() {
        closeTradeInWarningModal();

        // POST add-to-cart is the default on all origins.
        // Caveat: off samsung.com origins (e.g. github.io demo) the cart session cookie
        // may not carry over (third-party browser policy), so the cart can appear empty.
        // If the POST request itself fails off-site (CORS/Akamai), we fall back to the
        // legacy magic-link redirect. Add ?useMagic=1 to force the magic-link flow.
        const useMagic = new URLSearchParams(window.location.search).get('useMagic') === '1';
        const onSamsungOrigin = window.location.hostname === 'samsung.com' || window.location.hostname.endsWith('.samsung.com');

        if (useMagic) {
            if (pendingMagicUrl) {
                window.open(pendingMagicUrl, '_self');
            }
            window.selectedSkuForCart = null;
            window.selectedGiftSkus = null;
            pendingMagicUrl = null;
            return;
        }

        // Build products array from pending data (main SKU + optional gift SKUs)
        const products = [];
        if (window.selectedSkuForCart) {
            products.push({ productCode: window.selectedSkuForCart, qty: 1, services: [] });
        }
        (window.selectedGiftSkus || []).forEach(code => {
            if (code) products.push({ productCode: code, qty: 1, services: [] });
        });

        const voucher = useSamsungPay ? 'SPAY2026' : null;

        // Attach the official trade-in service to the main product (samsung.com origin only).
        // On failure nothing is added to cart — the user sees the error and can retry.
        const tiCalc = window.currentTradeInCalc;
        const hasLiveTradeIn = tradeInValue > 0 && tiCalc && tiCalc.imei && tiCalc.device;
        if (onSamsungOrigin && hasLiveTradeIn && products.length > 0) {
            const btn = document.getElementById('finalAddToCartBtn');
            const origText = btn ? btn.textContent : '';
            try {
                if (btn) { btn.textContent = '. . .'; btn.style.pointerEvents = 'none'; }
                products[0].services = await tiSubmitAssessment(tiCalc.device, tiCalc.imei, window.selectedSkuForCart);
            } catch (e) {
                console.error('Trade-in chain failed', e);
                if (btn) { btn.textContent = origText; btn.style.pointerEvents = ''; }
                showErrorModal(e.message || t('addToCartError'));
                return;
            }
            if (btn) { btn.textContent = origText; btn.style.pointerEvents = ''; }
        }

        if (products.length > 0) {
            const success = await addToCartPost(products, voucher, onSamsungOrigin);
            if (success) {
                const currentLang = getCurrentLang();
                const cartDomain = (currentLang === 'zh') ? 'https://shop.samsung.com/hk/cart' : 'https://shop.samsung.com/hk_en/cart';
                window.location.href = cartDomain;
            } else if (!onSamsungOrigin && pendingMagicUrl) {
                // POST blocked off-site (CORS/Akamai) → legacy redirect as safety net
                window.open(pendingMagicUrl, '_self');
            }
        }

        // cleanup
        window.selectedSkuForCart = null;
        window.selectedGiftSkus = null;
        pendingMagicUrl = null;
    }

    function appendShopAppUrl() {
        if (isInApp) {
            if (pendingMagicUrl && !pendingMagicUrl.includes('app=true')) {
                const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                pendingMagicUrl += `${separator}app=true`;
            }
            return;
        }
    }

    function showSamsungShopModal() {
        if (isInApp) {
            if (pendingMagicUrl && !pendingMagicUrl.includes('app=true')) {
                const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                pendingMagicUrl += `${separator}app=true`;
            }
            showTradeInWarningModal();
            return;
        }

        const modal = document.getElementById('samsung-shop-modal');
        if (modal) {
            modal.classList.remove('sehk-opacity');
            modal.classList.add('flex');
        } else {
            showTradeInWarningModal();
        }
    }

    function closeSamsungShopModal() {
        const modal = document.getElementById('samsung-shop-modal');
        if (modal) {
            modal.classList.remove('flex');
            modal.classList.add('sehk-opacity');
        }
    }

    function downloadSamsungShopApp() {
        window.open('https://samsungshop.onelink.me/6zKq/z089lfy4', '_blank');
    }

    function proceedFromSamsungShopModal() {
        const modal = document.getElementById('samsung-shop-modal');
        const checkbox = document.getElementById('add-to-app');

        if (checkbox && checkbox.checked && pendingMagicUrl) {
            if (!pendingMagicUrl.includes('app=true')) {
                const separator = pendingMagicUrl.includes('?') ? '&' : '?';
                pendingMagicUrl += `${separator}app=true`;
            }
        }

        if (modal) {
            modal.classList.remove('flex');
            modal.classList.add('sehk-opacity');
        }
        showTradeInWarningModal();
    }

    const origUpdateStickyBar = window.updateStickyBar;
    window.updateStickyBar = function() {
        origUpdateStickyBar?.();
        const btn = document.getElementById('buy-now-btn');
        const sticky = document.getElementById('sticky-bar');
        const hasStorage = (typeof selectedStorageIndex !== 'undefined' && selectedStorageIndex !== null && !isNaN(selectedStorageIndex));
        if (btn) btn.style.display = (sticky.classList.contains('sehk-opacity') || !hasStorage) ? 'none' : '';
    };

    window.dataLayer = window.dataLayer || [];

    function trackEvent(action, label, extra = {}) {
        const payload = {
            event: 'pd_buying_tool_interaction',
            an_tr: action,
            an_ca: 'option click',
            an_ac: 'pd buying tool',
            an_la: label,
            ...extra
        };
        window.dataLayer.push(payload);
        console.log('[Analytics]', payload);
    }
</script>

<script>
    function initSupabase() {
      if (window.supabase) {
        console.log("initSupabase");
        const SUPABASE_URL = 'https://rqdmrmkiuvecwnbtisfn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6fTm2KX3PJqvE5TI5baiYQ_FICRZOLC';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        startTracking(supabase);
      } else {
        setTimeout(initSupabase, 100);
      }
    }

    function startTracking(supabase) {
      console.log("startTracking");

      // --- URL Parsing Engine ---
      const urlClean = window.location.origin + window.location.pathname + window.location.hash;
      const urlParams = new URLSearchParams(window.location.search);
      const cid = urlParams.get('cid') || null;

      urlParams.delete('cid');
      const otherParams = urlParams.toString() || null;

      function trackImpressions() {
        const elementsToTrack = document.querySelectorAll('[data-impression]:not([data-tracked])');
        const impressionPayloads = [];

        elementsToTrack.forEach(el => {
          const val = el.getAttribute('data-impression');
          if (val) {
            impressionPayloads.push({
              timestamp: new Date().toISOString(),
              tracking_value: val,
              url_clean: urlClean,
              cid: cid,
              other_params: otherParams
            });
            el.setAttribute('data-tracked', 'true');
          }
        });

        if (impressionPayloads.length > 0) {
          supabase
            .from('impressions')
            .insert(impressionPayloads)
            .then(({ error }) => {
              if (error) console.error('[Supabase Tracker] Impression error:', error);
            });
        }
      }

      function trackImpressionsAsClicks() {
        const elementsToTrack = document.querySelectorAll('[data-tracking-special]:not([data-tracked])');
        const impressionPayloads = [];

        elementsToTrack.forEach(el => {
          const val = el.getAttribute('data-tracking-special');
          if (val) {
            impressionPayloads.push({
              timestamp: new Date().toISOString(),
              tracking_value: val,
              url_clean: urlClean,
              cid: cid,
              other_params: otherParams
            });
            el.setAttribute('data-tracked', 'true');
          }
        });

        if (impressionPayloads.length > 0) {
          supabase
            .from('clicks')
            .insert(impressionPayloads)
            .then(({ error }) => {
              if (error) console.error('[Supabase Tracker] Click error:', error);
            });
        }
      }

      const observer = new MutationObserver(() => {
        trackImpressions();
        trackImpressionsAsClicks();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      trackImpressions();
      trackImpressionsAsClicks();

      // --- 2. TRACK CLICKS ON INTERACTION ---
      document.addEventListener('click', function (event) {
        const button = event.target.closest('[data-tracking]');
        if (!button) return;

        const trackingValue = button.getAttribute('data-tracking');
        const timestamp = new Date().toISOString();

        supabase
          .from('clicks')
          .insert([{ 
            timestamp: timestamp, 
            tracking_value: trackingValue,
            url_clean: urlClean,
            cid: cid,
            other_params: otherParams
          }])
          .then(({ error }) => {
            if (error) console.error('[Supabase Tracker] Click error:', error);
          });
      });
    }

    initSupabase();
</script>
